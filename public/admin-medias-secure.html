<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VOYAGES21 - Admin medias equipe</title>
<style>
:root{--forest:#1b3a28;--forest2:#152e1f;--gold:#c8a440;--cream:#f5f0e8;--red:#b23a2e;--line:#e3ddd0;--text:#272822}*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:var(--cream);color:var(--text);padding-bottom:60px}header{position:sticky;top:0;z-index:10;background:var(--forest);color:white;padding:18px 20px;box-shadow:0 2px 10px rgba(0,0,0,.18)}header h1{font-size:1.2rem;margin:0}.sub{font-size:.82rem;opacity:.85;margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.wrap{max-width:860px;margin:20px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}.btn,.mini{border:0;border-radius:6px;background:var(--gold);color:#111;font-weight:800;cursor:pointer;padding:10px 14px}.btn.ghost{background:transparent;color:white;border:1px solid rgba(255,255,255,.5)}.btn.red,.mini.red{background:var(--red);color:white}.mini.dark{background:var(--forest);color:white}select,input{font:inherit;border:1px solid #cfc6b6;border-radius:6px;padding:10px;width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:220px}.muted{color:#6f756b;font-size:.85rem}.notice{background:#fff8e6;border:1px solid var(--gold);border-radius:8px;padding:12px;margin-bottom:14px}.hidden{display:none!important}.status{min-height:20px;margin-top:8px;font-size:.86rem;color:#566}.status.ok{color:#1a7a3a;font-weight:700}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.thumb{width:108px;height:74px;border:1px solid #ddd;border-radius:6px;background:#eee center/cover no-repeat;position:relative}.thumb button{position:absolute;right:-6px;top:-6px;border:0;border-radius:99px;background:var(--red);color:white;width:22px;height:22px;cursor:pointer}.login{position:fixed;inset:0;z-index:50;background:rgba(21,46,31,.96);display:grid;place-items:center;padding:20px}.login .box{background:white;max-width:430px;width:100%;border-radius:10px;padding:24px}.login h2{margin-top:0;color:var(--forest)}label{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--forest);margin:14px 0 6px}.key{font-size:.75rem;color:#999}.warn{background:#fff3e0;border:1px solid #e8a33d;color:#7b4300;border-radius:8px;padding:10px;margin-top:10px;font-size:.84rem}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--forest);color:white;padding:11px 18px;border-radius:999px;font-weight:800;transition:.25s;z-index:60}.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="login" id="loginBox"><div class="box"><h2>Acces equipe medias</h2><p class="muted">Mot de passe donne par le proprietaire. Session 24h ou 48h.</p><label>Mot de passe</label><input type="password" id="loginPassword"><label>Duree</label><select id="loginTtl"><option value="24">24 heures</option><option value="48">48 heures</option></select><br><br><button class="btn" id="loginBtn">Entrer</button><p class="status" id="loginStatus"></p></div></div>
<header><h1>VOYAGES21 - Gestion des medias</h1><div class="sub">Equipe : ajouter/remplacer photos et videos uniquement</div><div class="toolbar"><button class="btn ghost" onclick="window.open('/BROCHURE_VOYAGES21_AVEC_IMAGES_V7.html','_blank')">Ouvrir la brochure</button><button class="btn ghost" onclick="window.open('/design/homepage-v2-luxe.html','_blank')">Ouvrir l'accueil</button><button class="btn ghost" id="logoutBtn">Sortir</button></div></header>
<main class="wrap"><div class="notice"><b>Important :</b> les voyages ajoutes par l'admin proprietaire apparaissent automatiquement ici avec leur cle media.</div><section class="card"><label>Choisissez un voyage</label><select id="picker"><option value="">- Choisir -</option></select><p class="muted" id="countLine"></p></section><section class="card hidden" id="editor"><h2 id="title"></h2><div class="key" id="keyLine"></div><div class="warn hidden" id="warnBox"></div><label>Video YouTube / Vimeo</label><div class="row"><input id="videoLink" placeholder="https://youtu.be/... ou https://vimeo.com/..."><button class="mini dark" id="saveLinkBtn">Enregistrer</button><button class="mini red" id="clearVideoBtn">Effacer</button></div><label>Video galerie MP4</label><input type="file" id="videoFile" accept="video/*"><div class="status" id="videoStatus"></div><label>Ajouter photo par lien</label><div class="row"><input id="imageUrl" placeholder="https://..."><button class="mini dark" id="addImageUrlBtn">Ajouter</button></div><label>Ajouter photos par fichiers</label><input type="file" id="imageFiles" accept="image/*" multiple><div class="thumbs" id="thumbs"></div></section></main><div class="toast" id="toast">Enregistre</div>
<script type="module">import{upload}from'https://esm.sh/@vercel/blob@2.4.0/client';window.v21upload=upload;</script>
<script>
var BASE_PRODUCTS=[['modal-istanbul','Sejour a Istanbul'],['modal-istanbul-antalya','Istanbul & Antalya'],['modal-istanbul-bodrum','Istanbul & Bodrum'],['modal-marmaris-bodrum','Istanbul, Marmaris & Bodrum'],['modal-istanbul-antalya-11j','Istanbul & Antalya (11 jours)'],['modal-caire-nil-hurghada','Le Caire - Croisiere Nil - Hurghada'],['modal-caire-sharm','Le Caire & Sharm El Sheikh'],['modal-ouest-usa',"L'Ouest Complet - USA"],['modal-joyaux-canada','Les joyaux du Canada et des USA'],['modal-rocheuses',"Les Rocheuses et l'Ouest classique"],['modal-cuba','Cuba - La Havane & Varadero'],['modal-perou','Perou - Les merveilles Incas'],['modal-europe-1','Sejour a Las Palmas'],['modal-europe-2','Imperial Capitals'],['modal-europe-3','Al-Andalus'],['modal-europe-4','Athens, Rhodes & Kos'],['modal-europe-5','Athens Classical Greece'],['modal-europe-6','Circuit Espagne & Portugal'],['modal-europe-7','Circuit Italie'],['modal-europe-8','France & Suisse'],['modal-europe-9','Angleterre & Ecosse'],['modal-croisiere-1','Croisiere Mediterranee'],['modal-croisiere-2','Croisiere Mediterranee Premium'],['modal-chine','Circuit Chine'],['modal-malaisie','Malaisie & Thailande'],['modal-bangkok','Exotic Thailand'],['modal-vietnam','Decouverte du Vietnam'],['modal-zanzibar','Sejour a Zanzibar'],['modal-omra','Omra Mouharram 1448'],['modal-omra-06','Omra 06 Juillet'],['modal-omra-08','Omra 08 Juillet'],['modal-omra-istanbul','Omra via Istanbul'],['modal-omra-01','Omra 01 Juillet'],['modal-maroc-merzouga','Maroc - Merzouga'],['modal-maroc-bin-el-ouidane','Maroc - Bin El Ouidane'],['modal-maroc-dakhla','Maroc - Dakhla'],['modal-circuit-imperial-south','Circuit Imperial Cities & Southern Morocco'],['modal-circuit-imperial-cities','Circuit Imperial Cities Tour'],['modal-circuit-best-morocco','Circuit Best of Morocco'],['modal-circuit-discover-kingdom','Circuit Discover the Kingdom'],['modal-circuit-grand-discovery','Circuit Grand Discovery']];
var CMS_KEY='__cmsConfig',manifest={},products=[],titles={},currentKey='',currentRec=null;
function q(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function clone(o){return JSON.parse(JSON.stringify(o||{}))}function emptyRec(k){return{key:k,videoLink:'',videoUrl:'',images:[]}}function toast(m){var t=q('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1300)}function jsonOrThrow(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));return j})}
function login(){q('loginStatus').textContent='Verification...';fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'media',password:q('loginPassword').value,ttlHours:q('loginTtl').value})}).then(jsonOrThrow).then(function(){q('loginBox').classList.add('hidden');loadAll()}).catch(function(e){q('loginStatus').textContent=e.message})}
function logout(){fetch('/api/admin/session',{method:'DELETE'}).finally(function(){location.reload()})}
function requireSession(){return fetch('/api/admin/session',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){return j&&(j.role==='media'||j.role==='owner')}).catch(function(){return false})}
function buildProducts(){products=BASE_PRODUCTS.map(function(x){return{k:x[0],t:x[1]}});var cms=manifest[CMS_KEY]||{};(cms.voyages||[]).forEach(function(v){if(v&&v.mediaKey&&!products.some(function(p){return p.k===v.mediaKey})){products.push({k:v.mediaKey,t:(v.title||v.mediaKey)+' (CMS)'})}});titles={};products.forEach(function(p){titles[p.k]=p.t})}
function loadAll(){fetch('/api/media',{cache:'no-store'}).then(function(r){return r.ok?r.json():{}}).then(function(data){manifest=data||{};buildProducts();renderPicker();}).catch(function(){alert('Impossible de charger les medias.')})}
function renderPicker(){var sel=q('picker');sel.innerHTML='<option value="">- Choisir -</option>';products.forEach(function(p){var done=manifest[p.k]&&(manifest[p.k].videoLink||manifest[p.k].videoUrl||(manifest[p.k].images||[]).length);var o=document.createElement('option');o.value=p.k;o.textContent=(done?'✓ ':'')+p.t;sel.appendChild(o)});q('countLine').textContent=products.length+' voyages disponibles, y compris les voyages ajoutes par le CMS.'}
function selectProduct(k){currentKey=k;if(!k){q('editor').classList.add('hidden');return}currentRec=clone(manifest[k]||emptyRec(k));if(!currentRec.images)currentRec.images=[];q('title').textContent=titles[k]||k;q('keyLine').textContent=k;q('videoLink').value=currentRec.videoLink||'';q('editor').classList.remove('hidden');renderStatus();renderThumbs()}
function save(){return fetch('/api/media',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:currentKey,rec:currentRec})}).then(jsonOrThrow).then(function(){manifest[currentKey]=clone(currentRec);toast('Enregistre');renderPicker();q('picker').value=currentKey}).catch(function(e){alert('Enregistrement impossible : '+e.message)})}
function uploadFile(file){if(!window.v21upload)return Promise.reject(new Error('module upload non charge'));return window.v21upload(file.name,file,{access:'public',handleUploadUrl:'/api/media/upload',contentType:file.type||undefined}).then(function(r){return r.url})}
function renderStatus(){var s=q('videoStatus');if(currentRec.videoUrl){s.textContent='Video fichier en ligne';s.className='status ok'}else if(currentRec.videoLink){s.textContent='Lien video enregistre';s.className='status ok'}else{s.textContent='Aucune video';s.className='status'}}
function renderThumbs(){q('thumbs').innerHTML='';(currentRec.images||[]).forEach(function(it,i){var d=document.createElement('div');d.className='thumb';d.style.backgroundImage='url('+it.url+')';var b=document.createElement('button');b.textContent='x';b.onclick=function(){currentRec.images.splice(i,1);renderThumbs();save()};d.appendChild(b);q('thumbs').appendChild(d)})}
q('loginBtn').onclick=login;q('logoutBtn').onclick=logout;q('picker').onchange=function(){selectProduct(this.value)};q('saveLinkBtn').onclick=function(){currentRec.videoLink=q('videoLink').value.trim();if(currentRec.videoLink)currentRec.videoUrl='';renderStatus();save()};q('clearVideoBtn').onclick=function(){currentRec.videoLink='';currentRec.videoUrl='';q('videoLink').value='';renderStatus();save()};q('addImageUrlBtn').onclick=function(){var u=q('imageUrl').value.trim();if(!u)return;currentRec.images.push({url:u});q('imageUrl').value='';renderThumbs();save()};q('videoFile').onchange=function(){var f=this.files&&this.files[0];this.value='';if(!f)return;q('videoStatus').textContent='Televersement...';uploadFile(f).then(function(url){currentRec.videoUrl=url;currentRec.videoLink='';q('videoLink').value='';renderStatus();return save()}).catch(function(e){alert('Upload video impossible : '+e.message);renderStatus()})};q('imageFiles').onchange=function(){var fs=[].slice.call(this.files||[]);this.value='';if(!fs.length)return;var p=Promise.resolve();fs.forEach(function(f){p=p.then(function(){return uploadFile(f).then(function(url){currentRec.images.push({url:url});renderThumbs()})})});p.then(save).catch(function(e){alert('Upload image impossible : '+e.message)})};requireSession().then(function(ok){if(ok){q('loginBox').classList.add('hidden');loadAll()}});
</script>
</body>
</html>
