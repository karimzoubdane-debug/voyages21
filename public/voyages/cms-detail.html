<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voyage VOYAGES21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Geist:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--forest:#0d1a14;--gold:#c8a440;--cream:#f6f1e8;--ink:#111;--muted:#6b645a;--line:rgba(196,154,60,.2)}*{box-sizing:border-box}body{margin:0;font-family:Geist,Arial,sans-serif;background:var(--cream);color:var(--ink)}.top{position:sticky;top:0;z-index:5;background:rgba(13,26,20,.96);color:white;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top a{color:white;text-decoration:none;font-weight:800}.brand{font-family:Fraunces,Georgia,serif;font-size:1.3rem}.hero{min-height:62vh;background:#111 center/cover no-repeat;display:grid;align-items:end;position:relative;color:white}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.72))}.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-inner{position:relative;z-index:1;max-width:1120px;margin:0 auto;width:100%;padding:120px 28px 58px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-size:.72rem;font-weight:900}.hero h1{font-family:Fraunces,Georgia,serif;font-size:clamp(2.5rem,7vw,6rem);line-height:.98;margin:12px 0}.meta{display:flex;flex-wrap:wrap;gap:12px;color:rgba(255,255,255,.82);font-weight:700}.wrap{max-width:1120px;margin:0 auto;padding:44px 28px 70px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:34px}.card{background:white;border:1px solid var(--line);padding:26px;border-radius:8px;margin-bottom:18px}.card h2{font-family:Fraunces,Georgia,serif;font-size:2rem;margin:0 0 18px}.lead{font-size:1.08rem;line-height:1.75;color:#342f28}.list{display:grid;gap:10px;padding:0;margin:0;list-style:none}.list li{padding-left:20px;position:relative;color:#423b33;line-height:1.6}.list li:before{content:"";position:absolute;left:0;top:.68em;width:7px;height:7px;background:var(--gold);border-radius:999px}.days{display:grid;gap:12px}.day{border-left:3px solid var(--gold);padding:4px 0 4px 16px}.day b{display:block;color:#16130f}.side{position:sticky;top:82px;align-self:start}.price{font-family:Fraunces,Georgia,serif;font-size:2rem;color:var(--forest);margin:12px 0}.btn{display:flex;justify-content:center;align-items:center;text-decoration:none;background:var(--gold);color:#111;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:15px 18px;border-radius:4px}.empty{padding:40px;text-align:center}@media(max-width:850px){.wrap{grid-template-columns:1fr}.side{position:static}.hero-inner{padding-top:96px}.top{padding:0 16px}}
</style>
</head>
<body>
<nav class="top"><a href="/design/homepage-v2-luxe.html">‹ Accueil</a><div class="brand">voyages<sup>21</sup></div><a href="/BROCHURE_VOYAGES21_AVEC_IMAGES_V7.html">Brochure</a></nav>
<div id="app" class="empty">Chargement...</div>
<script>
(function(){
var CMS_KEY='__cmsConfig';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function lines(a){return Array.isArray(a)?a:[]}
function slug(){return new URLSearchParams(location.search).get('slug')||''}
function mediaFor(v,manifest){var rec=v.mediaKey?manifest[v.mediaKey]:null;return rec||{};}
function firstImage(v,rec){return v.image||(rec.images&&rec.images[0]&&rec.images[0].url)||''}
function render(v,manifest){var rec=mediaFor(v,manifest);var img=firstImage(v,rec);var wa=(v.whatsapp||(manifest[CMS_KEY]&&manifest[CMS_KEY].globals&&manifest[CMS_KEY].globals.whatsapp)||'212673280009').replace(/\D/g,'');var msg=encodeURIComponent('Bonjour, je suis interesse par le voyage '+(v.title||'VOYAGES21')+'. Pouvez-vous me faire une proposition ?');document.title=(v.title||'Voyage')+' - VOYAGES21';var media=rec.videoUrl?'<video autoplay muted loop playsinline src="'+esc(rec.videoUrl)+'"></video>':'';document.getElementById('app').className='';document.getElementById('app').innerHTML='<section class="hero" style="background-image:url('+esc(img)+')">'+media+'<div class="hero-inner"><div class="eyebrow">'+esc([v.menu,v.submenu,v.dest].filter(Boolean).join(' · '))+'</div><h1>'+esc(v.title||'Voyage VOYAGES21')+'</h1><div class="meta"><span>'+esc(v.duration||'Programme sur mesure')+'</span><span>'+esc(v.price||'Prix sur demande')+'</span></div></div></section><main class="wrap"><div><section class="card"><h2>Pourquoi vous allez adorer ce voyage</h2><div class="lead">'+esc(v.summary||'Programme VOYAGES21 personnalise.').replace(/\n/g,'<br>')+'</div></section><section class="card"><h2>Points forts</h2><ul class="list">'+lines(v.highlights).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section><section class="card"><h2>Programme</h2><div class="days">'+lines(v.days).map(function(d){return '<div class="day"><b>'+esc((d.num?d.num+' - ':'')+(d.title||''))+'</b><p>'+esc(d.text||'')+'</p></div>'}).join('')+'</div></section><section class="card"><h2>Inclus</h2><ul class="list">'+lines(v.inclus).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section><section class="card"><h2>Non inclus</h2><ul class="list">'+lines(v.exclus).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section></div><aside class="side card"><div class="eyebrow">A partir de</div><div class="price">'+esc(v.price||'Sur demande')+'</div><a class="btn" href="https://wa.me/'+wa+'?text='+msg+'">Demander un devis</a></aside></main>'}
fetch('/api/media',{cache:'no-store'}).then(function(r){return r.ok?r.json():{}}).then(function(manifest){var cms=manifest[CMS_KEY]||{};var v=(cms.voyages||[]).find(function(x){return x.slug===slug()});if(!v){document.getElementById('app').innerHTML='Voyage introuvable.';return}render(v,manifest)}).catch(function(){document.getElementById('app').innerHTML='Impossible de charger ce voyage.'})
})();
</script>
</body>
</html>
