<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Voyages21 — Votre offre partenaire</title>
<style>
  :root{
    --green:#1B3A28;--green-deep:#152E1F;--gold:#C8A440;--gold-soft:#E4CE93;
    --ground:#FBF9F4;--card:#FFFFFF;--ink:#20271F;--muted:#6B7268;--line:#E6DFD1;--chip:#EFE9DB;
    --shadow:0 1px 2px rgba(21,46,31,.06),0 8px 24px rgba(21,46,31,.06);--radius:14px;
  }
  @media (prefers-color-scheme:dark){:root{
    --green:#E6C765;--green-deep:#0E1A13;--gold:#D9B45A;--gold-soft:#7A6428;
    --ground:#0C120D;--card:#141E16;--ink:#E9EEE6;--muted:#9AA394;--line:#243026;--chip:#1C271E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}}
  :root[data-theme="dark"]{--green:#E6C765;--green-deep:#0E1A13;--gold:#D9B45A;--gold-soft:#7A6428;--ground:#0C120D;--card:#141E16;--ink:#E9EEE6;--muted:#9AA394;--line:#243026;--chip:#1C271E;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px 70px}
  header.top{background:var(--green-deep);color:#fff;margin:0 -14px;padding:22px 18px 18px;border-bottom:3px solid var(--gold);text-align:center}
  .brand{font-family:Georgia,serif;font-size:24px;letter-spacing:.5px}
  .brand b{color:var(--gold)}
  .tagline{font-size:11px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:2px;margin-top:2px}
  .for{margin-top:14px;font-size:12px;color:#C9D3C5;text-transform:uppercase;letter-spacing:1px}
  .pname{font-family:Georgia,serif;font-size:22px;color:#fff;margin-top:2px;font-weight:600}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-top:16px;box-shadow:var(--shadow);font-size:13.5px;color:var(--ink)}
  .intro b{color:var(--green)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px}
  .chips a{white-space:nowrap;font-size:12px;font-weight:600;text-decoration:none;color:var(--green);border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:999px}
  section.cat{margin-top:16px;scroll-margin-top:12px}
  .chead{font-family:Georgia,serif;font-size:16px;font-weight:700;color:var(--green);padding:0 4px 8px;border-bottom:1px solid var(--line)}
  .row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;margin-top:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;justify-content:space-between}
  .info{min-width:0;flex:1}
  .nom{font-size:14.5px;font-weight:600;line-height:1.25;word-break:break-word}
  .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .price{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
  .badge{background:var(--chip);border-radius:6px;padding:1px 7px;font-size:10px;color:var(--muted)}
  .adv{flex-shrink:0;text-align:center;min-width:96px}
  .adv .v{font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--green);line-height:1}
  .adv .k{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
  .cta{background:var(--green);color:#fff;border-radius:var(--radius);padding:18px;margin-top:22px;text-align:center}
  :root[data-theme="dark"] .cta{color:#0E1A13}
  .cta a{display:inline-block;margin-top:10px;background:var(--gold);color:#20271F;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:10px;font-size:14px}
  .foot{margin-top:22px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
  .err{padding:40px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Chargement de votre offre…</div></div>
<script src="./data.js"></script>
<script>
(function(){
  var app=document.getElementById('app');
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function b64d(s){ try{ return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; } }
  function priceNum(p){ var m=String(p||'').match(/[\d\s ]+/); if(!m) return 0; var n=m[0].replace(/[\s ]/g,''); return /^\d+$/.test(n)?parseInt(n,10):0; }
  function dev(p){ return /USD/.test(p)?'USD':'DH'; }
  function pDisp(p){ return String(p||'').replace('درهم','DH'); }
  function classify(tag,p){ var n=priceNum(p),d=dev(p);
    if(tag==='عمرة') return 'Omra / Hajj'; if(tag==='Maroc') return 'Maroc'; if(/roisi/i.test(tag)) return 'Croisières';
    if(d==='USD') n*=10; if(n<12000) return 'Séjours'; if(n<=28000) return 'Circuits internationaux'; return 'Premium / long-courrier'; }
  function defAdv(tag,p){ var n=priceNum(p),d=dev(p);
    if(tag==='عمرة') return '-2%'; if(tag==='Maroc') return 'value-add'; if(/roisi/i.test(tag)) return '-8%';
    if(d==='USD') n*=10; if(n<12000) return '-5%'; if(n<=28000) return '-7%'; return '-9%'; }

  var m=(location.hash||'').match(/o=([^&]+)/);
  var data=m?b64d(decodeURIComponent(m[1])):null;
  var V=(window.VOYAGES)||{};
  if(!data||!data.n){ app.innerHTML='<div class="err">Lien d\'offre invalide ou incomplet.</div>'; return; }
  if(!V||!Object.keys(V).length){ app.innerHTML='<div class="err">Catalogue momentanément indisponible.</div>'; return; }
  var ov=data.o||{};

  var order=[],groups={};
  Object.keys(V).forEach(function(key){ var v=V[key]||{}; var tag=(v.tag||'—').trim();
    var adv=(key in ov)?ov[key]:defAdv(tag,v.price);
    if(String(adv).trim().toLowerCase()==='rien'||String(adv).trim()==='') return; // masquer produits sans avantage
    var it={nom:v.title||key,duree:v.duration||'',prix:pDisp(v.price),gamme:classify(tag,v.price),adv:adv};
    if(!groups[tag]){groups[tag]=[];order.push(tag);} groups[tag].push(it); });

  function slug(t){ return 't'+t.replace(/[^a-zA-Z0-9]/g,''); }
  var wa='212661181618';
  var html='<header class="top"><div class="brand"><b>VOYAGES</b>21</div>'+
    '<div class="tagline">Le voyage cousu main</div>'+
    '<div class="for">Offre réservée aux adhérents</div>'+
    '<div class="pname">'+esc(data.n)+'</div></header>'+
    '<div class="intro">En tant qu\'adhérent·e de <b>'+esc(data.n)+'</b>, vous bénéficiez d\'avantages négociés sur nos voyages. '+
    'Mentionnez votre appartenance à <b>'+esc(data.n)+'</b> lors de votre demande de devis.</div>';

  var chips='<nav class="chips">';
  order.forEach(function(t){ chips+='<a href="#'+slug(t)+'">'+esc(t)+'</a>'; });
  chips+='</nav>';
  html+=chips;

  order.forEach(function(tag){
    html+='<section class="cat" id="'+slug(tag)+'"><div class="chead">'+esc(tag)+'</div>';
    groups[tag].forEach(function(it){
      html+='<div class="row"><div class="info"><div class="nom" dir="auto">'+esc(it.nom)+'</div>'+
        '<div class="meta"><span class="badge">'+esc(it.gamme)+'</span>'+(it.duree?'<span>'+esc(it.duree)+'</span>':'')+
        '<span class="price">'+esc(it.prix)+'</span></div></div>'+
        '<div class="adv"><div class="v">'+esc(it.adv)+'</div><div class="k">avantage</div></div></div>';
    });
    html+='</section>';
  });

  html+='<div class="cta"><div style="font-family:Georgia,serif;font-size:17px">Envie de partir ?</div>'+
    '<div style="font-size:13px;opacity:.9;margin-top:4px">Demandez votre devis en précisant « '+esc(data.n)+' ».</div>'+
    '<a href="https://wa.me/'+wa+'?text='+encodeURIComponent('Bonjour, je suis adhérent·e de '+data.n+' et je souhaite un devis.')+'">Demander un devis sur WhatsApp</a></div>';
  html+='<div class="foot">Avantages accordés dans le cadre du partenariat Voyages21 × '+esc(data.n)+'.<br>Prix indicatifs susceptibles d\'évoluer · voyages21.com</div>';
  app.innerHTML=html;
})();
</script>
</body>
</html>
