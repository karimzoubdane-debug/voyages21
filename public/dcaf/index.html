const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){const pw=document.getElementById("pw").value;const btn=document.getElementById("go");btn.disabled=true;document.getElementById("err").textContent="";
try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));

async function unlockWith(pw){document.getElementById("pw").value=pw;await unlock();}
const saved=localStorage.getItem("dcafpw");
if(saved){document.querySelector(".box p").textContent="Ouverture automatique…";unlockWith(saved);}
document.getElementById("go").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
