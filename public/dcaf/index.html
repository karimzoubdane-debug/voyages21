function unlock(){return doUnlock(document.getElementById("pw").value,true);}

document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
// Ouverture automatique : par lien (#clé) ou par souvenir (localStorage). Données toujours chiffrées.
const fromHash=decodeURIComponent((location.hash||"").slice(1));
let saved="";try{saved=localStorage.getItem("dcafpw")||"";}catch(e){}
if(fromHash){const p=document.querySelector(".box p");if(p)p.textContent="Ouverture automatique…";doUnlock(fromHash,false);}
else if(saved){const p=document.querySelector(".box p");if(p)p.textContent="Ouverture automatique…";doUnlock(saved,false);}
</script>
