const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function doUnlock(pw,fromInput){const btn=document.getElementById("go");if(btn)btn.disabled=true;const err=document.getElementById("err");if(err)err.textContent="";
try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
const html=new TextDecoder().decode(pt);try{localStorage.setItem("dcafpw",pw);}catch(e){}document.open();document.write(html);document.close();}
catch(e){if(btn)btn.disabled=false;try{if(localStorage.getItem("dcafpw")===pw)localStorage.removeItem("dcafpw");}catch(e2){}if(fromInput){if(err)err.textContent="Mot de passe incorrect.";const p=document.querySelector(".box p");if(p)p.textContent="Document protégé — saisissez le mot de passe.";}}}
function unlock(){return doUnlock(document.getElementById("pw").value,true);}
document.getElementById("go").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
// Ouverture automatique : par lien (#clé) ou par souvenir (localStorage). Données toujours chiffrées.
const fromHash=decodeURIComponent((location.hash||"").slice(1));
let saved="";try{saved=localStorage.getItem("dcafpw")||"";}catch(e){}
if(fromHash){const p=document.querySelector(".box p");if(p)p.textContent="Ouverture automatique…";doUnlock(fromHash,false);}
else if(saved){const p=document.querySelector(".box p");if(p)p.textContent="Ouverture automatique…";doUnlock(saved,false);}
