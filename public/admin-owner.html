<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VOYAGES21 - Admin proprietaire</title>
<style>
:root{--forest:#143622;--gold:#c8a440;--cream:#f6f1e8;--line:#ddd3c3;--red:#a7362b;--ink:#20231f}*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:var(--cream);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:var(--forest);color:white;padding:16px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center}.wrap{max-width:1180px;margin:22px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#526052;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid #cfc6b6;border-radius:6px;padding:10px;font:inherit}textarea{min-height:88px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab,.btn{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:6px;font-weight:800;cursor:pointer}.tab.active,.btn{background:var(--gold);border-color:var(--gold);color:#142016}.btn.dark{background:var(--forest);border-color:var(--forest);color:white}.btn.red{background:var(--red);border-color:var(--red);color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.muted{color:#6c7069;font-size:13px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:6px;padding:10px;background:#fffdf8;display:flex;justify-content:space-between;gap:10px;align-items:center}.login{position:fixed;inset:0;background:rgba(20,54,34,.96);z-index:50;display:grid;place-items:center;padding:20px}.login .box{max-width:430px;width:100%;background:white;border-radius:10px;padding:24px}@media(max-width:760px){.grid,.grid3{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="login" id="loginBox"><div class="box"><h2>Admin proprietaire VOYAGES21</h2><p class="muted">Session 24h ou 48h selon ton choix.</p><label>Mot de passe proprietaire</label><input type="password" id="loginPassword"><label>Duree</label><select id="loginTtl"><option value="24">24 heures</option><option value="48">48 heures</option></select><br><br><button class="btn dark" id="loginBtn">Entrer</button><p id="loginStatus" class="muted"></p></div></div>
<header><div><b>VOYAGES21 - Admin proprietaire</b><div class="muted" style="color:#d8dccf">Accueil, menus, rubriques, voyages</div></div><div class="row"><span id="saveStatus">Non charge</span><button class="btn" id="saveBtn">Enregistrer</button><button class="btn dark" id="logoutBtn">Sortir</button></div></header>
<main class="wrap">
<div class="tabs"><button class="tab active" data-tab="home">Accueil</button><button class="tab" data-tab="menus">Menus</button><button class="tab" data-tab="voyages">Voyages</button><button class="tab" data-tab="sections">Sections</button></div>
<section class="card" id="tab-home"><h2>Page d'accueil</h2><div class="grid"><div class="wide"><label>Video de cover</label><input id="homeVideo" placeholder="URL MP4"></div><div><label>Petit titre</label><input id="homeLabel"></div><div><label>Bouton principal</label><input id="homeButton"></div><div class="wide"><label>Grand titre</label><textarea id="homeTitle"></textarea></div><div class="wide"><label>Sous-titre</label><textarea id="homeSubtitle"></textarea></div><div><label>Calligraphie</label><select id="homeFont"><option value="editorial">Editorial luxe italique</option><option value="classic">Classique serif</option><option value="modern">Moderne sobre</option><option value="script">Calligraphie douce</option></select></div><div><label>Recherche placeholder</label><input id="searchPlaceholder"></div></div></section>
<section class="card hidden" id="tab-menus"><h2>Menus et sous-menus</h2><p class="muted">Exemples: Hajj, ou Sejours / Excursions dans Mon Maroc.</p><div class="grid3"><div><label>Menu principal</label><input id="menuLabel" placeholder="Hajj"></div><div><label>Sous-menu</label><input id="menuSub" placeholder="Sejours"></div><div><label>Lien optionnel</label><input id="menuUrl" placeholder="# ou /voyages/..."></div></div><br><button class="btn dark" id="addMenuBtn">Ajouter</button><div class="list" id="menuList" style="margin-top:12px"></div></section>
<section class="card hidden" id="tab-voyages"><h2>Voyages</h2><div class="grid3"><div><label>Voyage existant</label><select id="voyageSelect"><option value="">Nouveau voyage</option></select></div><div><label>Publie</label><select id="voyagePublished"><option value="true">Oui</option><option value="false">Non</option></select></div><div><label>Mis en avant</label><select id="voyageFeatured"><option value="false">Non</option><option value="true">Oui</option></select></div><div><label>Slug</label><input id="voyageSlug"></div><div><label>Media key</label><input id="voyageMediaKey"></div><div><label>Destination / pays</label><input id="voyageDest"></div><div><label>Menu principal</label><input id="voyageMenu" placeholder="Destinations Monde"></div><div><label>Sous-menu</label><input id="voyageSubmenu" placeholder="Asie"></div><div><label>Duree</label><input id="voyageDuration"></div><div class="wide"><label>Titre</label><input id="voyageTitle"></div><div><label>Prix</label><input id="voyagePrice"></div><div><label>WhatsApp</label><input id="voyageWhatsapp" placeholder="212673280009"></div><div class="wide"><label>Image carte / hero</label><input id="voyageImage"></div><div class="wide"><label>Resume</label><textarea id="voyageSummary"></textarea></div><div><label>Points forts (1 par ligne)</label><textarea id="voyageHighlights"></textarea></div><div><label>Inclus (1 par ligne)</label><textarea id="voyageInclus"></textarea></div><div><label>Exclus (1 par ligne)</label><textarea id="voyageExclus"></textarea></div><div class="wide"><label>Programme jours: Jour | Titre | Texte</label><textarea id="voyageDays"></textarea></div></div><br><div class="row"><button class="btn dark" id="saveVoyageBtn">Enregistrer ce voyage</button><button class="btn red" id="deleteVoyageBtn">Supprimer</button></div><div class="list" id="voyageList" style="margin-top:12px"></div></section>
<section class="card hidden" id="tab-sections"><h2>Sections de l'accueil</h2><div class="grid"><div><label>Titre destinations</label><input id="secDestTitle"></div><div><label>Sous-titre destinations</label><input id="secDestSub"></div><div><label>Libelle stats</label><input id="secStats"></div><div><label>Telephone WhatsApp global</label><input id="globalWhatsapp"></div></div></section>
</main>
<script>
const CMS_KEY="__cmsConfig", HOME_KEY="__homepageCover";
let manifest={}, cms={menus:[],voyages:[],sections:{},globals:{}};
const DEFAULT_HOME={videoUrl:"",label:"Voyages Ete 2026",title:"Ici commence\nvotre bonheur.",subtitle:"Tarifs exclusifs, options garanties.",buttonText:"Voir les programmes",fontStyle:"editorial"};
function q(id){return document.getElementById(id)}
function lines(v){return String(v||"").split("\n").map(x=>x.trim()).filter(Boolean)}
function slugify(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
async function jsonOrThrow(r){const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||("HTTP "+r.status));return j}
async function login(){try{q("loginStatus").textContent="Verification...";await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role:"owner",password:q("loginPassword").value,ttlHours:q("loginTtl").value})}).then(jsonOrThrow);q("loginBox").classList.add("hidden");await loadAll()}catch(e){q("loginStatus").textContent=e.message}}
async function logout(){await fetch("/api/admin/session",{method:"DELETE"}).catch(()=>{});location.reload()}
async function requireSession(){const r=await fetch("/api/admin/session",{cache:"no-store"});if(r.ok){const j=await r.json();return j.role==="owner"}return false}
async function loadAll(){q("saveStatus").textContent="Chargement...";manifest=await fetch("/api/media",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}));cms=Object.assign({menus:[],voyages:[],sections:{},globals:{}},manifest[CMS_KEY]||{});setHomeFields(Object.assign({},DEFAULT_HOME,manifest[HOME_KEY]||{}));setSectionFields();renderMenus();renderVoyages();q("saveStatus").textContent="Charge"}
async function saveAll(){readSectionFields();manifest[CMS_KEY]=cms;manifest[HOME_KEY]=readHomeFields();q("saveStatus").textContent="Enregistrement...";await fetch("/api/media",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(manifest)}).then(jsonOrThrow);q("saveStatus").textContent="Enregistre";setTimeout(()=>q("saveStatus").textContent="A jour",1200)}
function showTab(name,btn){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");["home","menus","voyages","sections"].forEach(t=>q("tab-"+t).classList.toggle("hidden",t!==name))}
function setHomeFields(d){q("homeVideo").value=d.videoUrl||"";q("homeLabel").value=d.label||"";q("homeButton").value=d.buttonText||"";q("homeTitle").value=d.title||"";q("homeSubtitle").value=d.subtitle||"";q("homeFont").value=d.fontStyle||"editorial";q("searchPlaceholder").value=(cms.sections&&cms.sections.searchPlaceholder)||""}
function readHomeFields(){return {videoUrl:q("homeVideo").value.trim(),label:q("homeLabel").value.trim(),buttonText:q("homeButton").value.trim(),title:q("homeTitle").value.trim(),subtitle:q("homeSubtitle").value.trim(),fontStyle:q("homeFont").value}}
function addMenu(){const label=q("menuLabel").value.trim();if(!label)return;cms.menus.push({id:slugify(label+" "+q("menuSub").value),label:label,submenu:q("menuSub").value.trim(),url:q("menuUrl").value.trim(),order:cms.menus.length+1});q("menuLabel").value=q("menuSub").value=q("menuUrl").value="";renderMenus()}
function renderMenus(){q("menuList").innerHTML=(cms.menus||[]).map((m,i)=>"<div class=\"item\"><div><b>"+m.label+"</b>"+(m.submenu?" / "+m.submenu:"")+"<br><span class=\"muted\">"+(m.url||"#")+"</span></div><button class=\"btn red\" data-remove-menu=\""+i+"\">Retirer</button></div>").join("")||"<p class=\"muted\">Aucun menu CMS ajoute.</p>";document.querySelectorAll("[data-remove-menu]").forEach(b=>b.onclick=()=>{cms.menus.splice(Number(b.dataset.removeMenu),1);renderMenus()})}
function currentVoyage(){const title=q("voyageTitle").value.trim();return {slug:q("voyageSlug").value.trim()||slugify(title),mediaKey:q("voyageMediaKey").value.trim()||("modal-"+slugify(title)),published:q("voyagePublished").value==="true",featured:q("voyageFeatured").value==="true",title:title,dest:q("voyageDest").value.trim(),menu:q("voyageMenu").value.trim(),submenu:q("voyageSubmenu").value.trim(),duration:q("voyageDuration").value.trim(),price:q("voyagePrice").value.trim(),whatsapp:q("voyageWhatsapp").value.trim()||"212673280009",image:q("voyageImage").value.trim(),summary:q("voyageSummary").value.trim(),highlights:lines(q("voyageHighlights").value),inclus:lines(q("voyageInclus").value),exclus:lines(q("voyageExclus").value),days:lines(q("voyageDays").value).map(x=>{const p=x.split("|").map(y=>y.trim());return {num:p[0]||"",title:p[1]||"",text:p.slice(2).join(" | ")||""}})}}
function fillVoyage(v){q("voyageSlug").value=v.slug||"";q("voyageMediaKey").value=v.mediaKey||"";q("voyagePublished").value=String(v.published!==false);q("voyageFeatured").value=String(!!v.featured);q("voyageTitle").value=v.title||"";q("voyageDest").value=v.dest||"";q("voyageMenu").value=v.menu||"";q("voyageSubmenu").value=v.submenu||"";q("voyageDuration").value=v.duration||"";q("voyagePrice").value=v.price||"";q("voyageWhatsapp").value=v.whatsapp||"";q("voyageImage").value=v.image||"";q("voyageSummary").value=v.summary||"";q("voyageHighlights").value=(v.highlights||[]).join("\n");q("voyageInclus").value=(v.inclus||[]).join("\n");q("voyageExclus").value=(v.exclus||[]).join("\n");q("voyageDays").value=(v.days||[]).map(d=>[d.num,d.title,d.text].join(" | ")).join("\n")}
function loadVoyage(slug){const v=(cms.voyages||[]).find(x=>x.slug===slug);if(v)fillVoyage(v)}
function saveVoyage(){const v=currentVoyage();if(!v.title){alert("Titre obligatoire");return}cms.voyages=(cms.voyages||[]).filter(x=>x.slug!==v.slug);cms.voyages.push(v);renderVoyages();fillVoyage(v)}
function deleteVoyage(){const slug=q("voyageSlug").value.trim();if(!slug||!confirm("Supprimer ce voyage CMS ?"))return;cms.voyages=(cms.voyages||[]).filter(x=>x.slug!==slug);fillVoyage({});renderVoyages()}
function renderVoyages(){q("voyageSelect").innerHTML="<option value=\"\">Nouveau voyage</option>"+(cms.voyages||[]).map(v=>"<option value=\""+v.slug+"\">"+v.title+"</option>").join("");q("voyageList").innerHTML=(cms.voyages||[]).map(v=>"<div class=\"item\"><div><b>"+v.title+"</b><br><span class=\"muted\">"+v.dest+" - "+v.slug+" - "+v.mediaKey+"</span></div><button class=\"btn\" data-load-voyage=\""+v.slug+"\">Modifier</button></div>").join("")||"<p class=\"muted\">Aucun voyage CMS ajoute.</p>";document.querySelectorAll("[data-load-voyage]").forEach(b=>b.onclick=()=>loadVoyage(b.dataset.loadVoyage))}
function setSectionFields(){const s=cms.sections||{},g=cms.globals||{};q("secDestTitle").value=s.destTitle||"";q("secDestSub").value=s.destSub||"";q("secStats").value=s.statsLabel||"";q("globalWhatsapp").value=g.whatsapp||"";q("searchPlaceholder").value=s.searchPlaceholder||""}
function readSectionFields(){cms.sections=cms.sections||{};cms.globals=cms.globals||{};cms.sections.destTitle=q("secDestTitle").value;cms.sections.destSub=q("secDestSub").value;cms.sections.statsLabel=q("secStats").value;cms.sections.searchPlaceholder=q("searchPlaceholder").value;cms.globals.whatsapp=q("globalWhatsapp").value}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab,b));q("loginBtn").onclick=login;q("logoutBtn").onclick=logout;q("saveBtn").onclick=saveAll;q("addMenuBtn").onclick=addMenu;q("saveVoyageBtn").onclick=saveVoyage;q("deleteVoyageBtn").onclick=deleteVoyage;q("voyageSelect").onchange=e=>loadVoyage(e.target.value);requireSession().then(ok=>{if(ok){q("loginBox").classList.add("hidden");loadAll()}});
</script>
</body>
</html>
