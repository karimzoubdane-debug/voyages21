<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>V21 STUDIO — Pilotage contenu Voyages21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1B3A28; --green2:#152E1F; --gold:#C8A440; --cream:#F5F0E8;
    --ink:#23241f; --muted:#6b6f66; --line:#e4ddcf; --ok:#2e7d52; --warn:#b5862a; --bad:#a8432f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--cream)}
  h1,h2,h3,.serif{font-family:'Playfair Display',serif}
  header{background:var(--green);color:var(--cream);padding:22px 20px;text-align:center}
  header .logo{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;letter-spacing:.5px}
  header .logo b{color:var(--gold);font-style:normal}
  header .sub{font-size:13px;opacity:.85;margin-top:4px}
  .bar{background:var(--green2);color:var(--cream);padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .bar label{font-size:13px;opacity:.85}
  select{font-family:inherit;font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid var(--gold);background:var(--cream);color:var(--green);font-weight:700}
  .meta{margin-left:auto;font-size:12px;opacity:.8}
  main{max-width:1100px;margin:0 auto;padding:24px 18px 80px}
  section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px;box-shadow:0 2px 14px rgba(27,58,40,.04)}
  section > h2{margin:0 0 4px;font-size:22px;color:var(--green);display:flex;align-items:center;gap:10px}
  .lead{color:var(--muted);font-size:14px;margin:0 0 18px}
  .sep{height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:14px 0 18px;border-radius:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fffdf9}
  .card h3{margin:0 0 6px;font-size:18px;color:var(--green)}
  .badge{display:inline-block;background:var(--gold);color:#3a2c08;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
  .price{font-weight:700;color:var(--green);font-size:17px;margin:6px 0}
  .row{font-size:13.5px;margin:5px 0;line-height:1.45}
  .row b{color:var(--green2)}
  .pill-list{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
  .pill-list.exclus{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--green2);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  tr.v td{background:#f4fbf6}
  .chk{color:var(--ok);font-weight:700}
  .swot{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .quad{border-radius:12px;padding:15px}
  .quad h4{margin:0 0 8px;font-size:15px}
  .quad ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
  .q-force{background:#eef7f0;border:1px solid #cfe6d6}.q-force h4{color:var(--ok)}
  .q-faible{background:#fcf0ec;border:1px solid #f0d6cd}.q-faible h4{color:var(--bad)}
  .q-amel{background:#fbf6e8;border:1px solid #ecdfba}.q-amel h4{color:var(--warn)}
  .note{background:#fff7e6;border:1px solid #ecdfba;border-radius:10px;padding:11px 14px;font-size:13px;color:#6b5618;margin-top:12px}
  .note.bad{background:#fcf0ec;border-color:#f0d6cd;color:#7a2f1f}
  .post{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fffdf9;margin-bottom:14px}
  .post .accroche{font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:var(--green);margin:6px 0}
  .post .legende{font-size:13.5px;margin:8px 0}
  .post .hash{font-size:12.5px;color:var(--gold);font-weight:700}
  .post .audio{font-size:12.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .qbox{border-left:4px solid var(--gold);padding:10px 14px;background:#fffdf9;border-radius:0 10px 10px 0;margin-bottom:10px;font-size:14px}
  .qbox .st{font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase}
  tr.v td{background:#eaf6ee}
  .v-price{color:#1B3A28;font-weight:800}
  .analyse{background:#eef2ff;border:1px solid #c7d2fe;border-left:5px solid #4f46e5;border-radius:10px;padding:14px 16px;font-size:13.5px;color:#312e81;margin-top:14px}
  .analyse h4{margin:0 0 8px;color:#4338ca;font-size:15px;font-family:'Playfair Display',serif}
  .analyse ul{margin:6px 0 0;padding-left:18px;line-height:1.6}
  .vtag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;margin-right:6px}
  .vtag-ugc{background:#fbe9c7;color:#7a5a12}
  .vtag-reel{background:#dcefe2;color:#1f6b43}
  .vtag-intl{background:#dde6fb;color:#27408b}
  .vorig{font-size:12px;color:var(--muted);font-weight:600}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  .scrollx::-webkit-scrollbar{height:10px}
  .scrollx::-webkit-scrollbar-thumb{background:var(--gold);border-radius:5px}
  .scrollx::-webkit-scrollbar-track{background:#efe7d5;border-radius:5px}
  .scrollx table{min-width:1080px;margin:0 auto;border-collapse:collapse}
  .scrollx th,.scrollx td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .scrollx th{white-space:nowrap;font-size:11.5px}
  .scrollx td{font-size:12.5px}
  .scrollx td.nowrap{white-space:nowrap}
  .scrollx td.agcell{white-space:nowrap;font-weight:700}
  .scrollx td.pxcell{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .scrollx td.datecell{line-height:1.7;min-width:130px}
  .scrollx td.inccell{min-width:150px}
  .scrollx ul{margin:0;padding-left:15px}
  .scrollhint{font-size:12.5px;color:var(--bad);font-weight:700;margin:0 0 6px;text-align:center}
  .scrollx table{min-width:920px;margin:0}
  .scrollx td{vertical-align:top;font-size:12.5px}
  .scrollx ul{margin:0;padding-left:15px}
  .ok-li{color:var(--ok)}.bad-li{color:var(--bad)}
  .viral2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  @media(max-width:760px){.viral2{grid-template-columns:1fr}.scrollx table{min-width:880px}}
  .vcol h3{margin:0 0 8px;font-size:16px}
  .vitem{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fffdf9;margin-bottom:12px}
  .vitem .vstat{color:var(--gold);font-weight:700;font-size:12.5px}
  .vitem .vrow{font-size:12.5px;margin:4px 0;line-height:1.5}
  .vitem .vrow b{color:var(--green2)}
  .infcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fffdf9}
  .infcard .flag{font-size:12px;font-weight:700}
  .pbblock{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;margin-bottom:14px;box-shadow:0 2px 10px rgba(27,58,40,.04)}
  .pbblock h3{margin:0 0 8px;color:var(--green);font-size:18px}
  .trend{border-left:4px solid var(--gold);padding:11px 15px;background:#fffdf9;border-radius:0 10px 10px 0;margin-bottom:11px}
  .trend .rank{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);font-weight:700;margin-right:6px}
  .newdest{background:#eef7f0;border:1px solid #cfe6d6;border-radius:10px;padding:5px 9px;font-size:11px;font-weight:700;color:var(--ok);display:inline-block;margin-top:6px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  .hidden{display:none}
  .soon{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
</style>
</head>
<body>
<header>
  <div class="logo">Voyages<b>21</b> · STUDIO</div>
  <div class="sub">Plateforme de pilotage contenu — partageable avec les équipes</div>
</header>

<div class="bar">
  <label for="sel">Produit :</label>
  <select id="sel"></select>
  <span class="meta" id="meta"></span>
</div>

<main id="app"></main>
<footer id="foot"></footer>

<script src="/v21-studio/studio-data.js"></script>
<script>
  const D = window.V21_STUDIO;
  const sel = document.getElementById('sel');
  const app = document.getElementById('app');
  document.getElementById('meta').textContent = D.meta.version + " · maj " + D.meta.maj;
  document.getElementById('foot').innerHTML = D.meta.note + " · Voyages21 — agence sur mesure depuis 2000<br><b>Plateforme développée par DA21 pour VOYAGES21</b>";

  D.produits.forEach(p=>{
    const o=document.createElement('option');
    o.value=p.id; o.textContent=p.label + (p.etat!=='pret'?' (en préparation)':'');
    sel.appendChild(o);
  });

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function render(id){
    const p = D.produits.find(x=>x.id===id);
    if(!p || p.etat!=='pret'){ app.innerHTML = '<section><div class="soon">🔧 Données en préparation pour ce produit. Reviens bientôt.</div></section>'; return; }
    const d = D[id];
    if(d && d.type==='playbook'){ app.innerHTML = renderPlaybook(d); return; }
    if(d && d.type==='tendances'){ app.innerHTML = renderTendances(d); return; }
    let h = '';

    // 1) OFFRES
    h += '<section><h2>🧳 Nos offres — détails techniques</h2><p class="lead">Données issues de la brochure / du site Voyages21.</p><div class="grid">';
    d.offres.forEach(o=>{
      h += '<div class="card"><span class="badge">'+esc(o.badge)+'</span><h3>'+esc(o.titre)+'</h3>'+
        '<div class="price">'+esc(o.prix)+'</div>'+
        '<div class="row"><b>Durée :</b> '+esc(o.duree)+'</div>'+
        '<div class="row"><b>Prix :</b> '+esc(o.prixDetail)+'</div>'+
        '<div class="row"><b>Hôtels :</b> '+esc(o.hotels)+'</div>'+
        '<div class="row"><b>Pension :</b> '+esc(o.pension)+'</div>'+
        '<div class="row"><b>Vols :</b> '+esc(o.vols)+'</div>'+
        '<div class="row" style="color:var(--warn)">'+esc(o.volsHoraires)+'</div>'+
        '<div class="row"><b>Visites :</b> '+esc(o.visites)+'</div>'+
        '<div class="row"><b>Dates :</b> '+esc(o.dates)+'</div>'+
        '<div class="row"><b>Inclus :</b></div><ul class="pill-list">'+o.inclus.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
        '<div class="row"><b>Non inclus :</b></div><ul class="pill-list exclus">'+o.exclus.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
      '</div>';
    });
    h += '</div></section>';

    // 2) VEILLE
    const v = d.concurrents;
    h += '<section><h2>🔭 Veille concurrents</h2><p class="lead">Comptes ciblés + benchmark prix vérifié.</p>';
    h += '<div class="grid">';
    v.comptes.forEach(c=>{
      h += '<div class="card"><h3>'+esc(c.nom)+'</h3><div class="price">'+esc(c.abonnes)+' abonnés</div>'+
        '<div class="row"><b>'+esc(c.type)+'</b></div><div class="row">'+esc(c.note)+'</div></div>';
    });
    // Benchmark — table riche (réutilisable MA + International)
    const alink = (url,label)=> url ? '<a href="'+esc(url)+'" target="_blank" rel="noopener" style="color:var(--gold);font-weight:700">'+esc(label)+'</a>' : '<span style="color:var(--muted)">nd</span>';
    const liList = (arr,cls)=> (arr&&arr.length) ? '<ul>'+arr.map(x=>'<li class="'+cls+'">'+esc(x)+'</li>').join('')+'</ul>' : '<span style="color:var(--muted)">nd</span>';
    function benchTable(rows){
      let t = '<p class="scrollhint">↔ Tableau large — fais défiler horizontalement pour voir TOUTES les colonnes (Inclus · Non inclus · Compagnie · Horaires · Dates · Site · Instagram).</p><div class="scrollx"><table><tr><th>Agence</th><th>Offre</th><th>✅ Inclus</th><th>⛔ Non inclus</th><th>✈️ Compagnie</th><th>🕐 Horaires</th><th>📅 Dates</th><th>Durée</th><th>Hôtels</th><th>Prix dès</th><th>🌐 Site</th><th>📷 Insta</th><th>✓</th></tr>';
      const dateCell = d => { if(!d || d==='nd') return '<span style="color:var(--muted)">nd</span>'; return d.split(/\s*[·•|]\s*/).filter(Boolean).map(x=>esc(x.trim())).join('<br>'); };
      rows.forEach(b=>{
        const isNous = b.nous || /Voyages21|\(NOUS\)/.test(b.agence);
        const px = isNous ? '<span class="v-price">'+esc(b.prix)+'</span>' : '<b>'+esc(b.prix)+'</b>';
        t += '<tr'+(isNous?' class="v"':'')+'><td class="agcell">'+esc(b.agence)+'</td><td>'+esc(b.offre||'—')+'</td>'+
          '<td class="inccell">'+liList(b.inclus,'ok-li')+'</td><td class="inccell">'+liList(b.exclus,'bad-li')+'</td>'+
          '<td>'+esc(b.compagnie||'nd')+'</td><td>'+esc(b.horaires||'nd')+'</td><td class="datecell">'+dateCell(b.dates)+'</td>'+
          '<td class="nowrap">'+esc(b.duree||'—')+'</td><td>'+esc(b.hotels||'—')+'</td><td class="pxcell">'+px+'</td>'+
          '<td class="nowrap">'+alink(b.site,'site ↗')+'</td><td class="nowrap">'+alink(b.instagram,'IG ↗')+'</td>'+
          '<td style="text-align:center">'+(b.verifie?'<span class="chk">✓</span>':'—')+'</td></tr>';
      });
      return t+'</table></div>';
    }
    h += '</div><div class="sep"></div><h3 style="color:var(--green)">🇲🇦 '+esc(v.benchmarkTitre || 'Benchmark concurrents Maroc')+'</h3>'+
      '<p class="lead">Colonnes alignées pour comparer à saison/dates équivalentes. Liens site + Instagram cliquables.</p>'+ benchTable(v.benchmarkPrix);
    if(v.benchmarkAnalyse && v.benchmarkAnalyse.length){
      h += '<div class="analyse"><h4>📊 Où se situe Voyages21 (Maroc) — fort / faible, d\'après la SEULE data scrapée</h4><ul>'+v.benchmarkAnalyse.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
    }
    if(v.benchmarkIntl && v.benchmarkIntl.length){
      h += '<div class="sep"></div><h3 style="color:var(--green)">🌍 '+esc(v.benchmarkIntlTitre || 'Benchmark international — agences France & Espagne')+'</h3>'+
        '<p class="lead">5 agences outgoing FR/ES + Voyages21 (6e). ⚠️ Prix en € → convertir (~1 € ≈ 10,8 DH) ; vérifier ce qui est inclus (vols souvent depuis Europe).</p>'+ benchTable(v.benchmarkIntl);
      if(v.benchmarkIntlAnalyse && v.benchmarkIntlAnalyse.length){
        h += '<div class="analyse"><h4>📊 Ce qui distingue Voyages21 vs Europe — fort / faible (data scrapée)</h4><ul>'+v.benchmarkIntlAnalyse.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
      }
    }
    if(v.engagementReel && v.engagementReel.length){
      h += '<div class="sep"></div><h3 style="color:var(--green)">📊 Engagement réel (Apify) — posts sur cette destination</h3>'+
        (v.engagementReelNote?'<div class="note">ℹ️ '+esc(v.engagementReelNote)+'</div>':'')+
        '<table><tr><th>Compte</th><th>Format</th><th>Vues</th><th>❤️</th><th>💬</th></tr>'+
        v.engagementReel.map(e=>'<tr><td>'+esc(e.compte)+'</td><td>'+esc(e.format)+'</td><td><b>'+esc(e.vues)+'</b></td><td>'+esc(e.likes)+'</td><td>'+esc(e.comm)+'</td></tr>').join('')+'</table>';
    }
    if(v.learnings && v.learnings.length){
      h += '<h3 style="color:var(--green);margin-top:14px">💡 Apprentissages</h3><ul class="pill-list">'+v.learnings.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    }
    h += '<div class="note">'+esc(v.apifyStatut)+'</div></section>';

    // 3) CADRAN
    const c = d.cadran;
    h += '<section><h2>🎯 Cadran — forces / faiblesses / à améliorer</h2><div class="swot">';
    h += '<div class="quad q-force"><h4>✅ Points forts</h4><ul>'+c.forces.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
    h += '<div class="quad q-faible"><h4>⚠️ Points faibles</h4><ul>'+c.faiblesses.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
    h += '<div class="quad q-amel"><h4>🛠️ À améliorer</h4><ul>'+c.ameliorer.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
    h += '</div></section>';

    // 4) CONTENU
    const ct = d.contenu;
    h += '<section><h2>✍️ Propositions de contenu</h2><p class="lead">'+esc(ct.planning)+'</p>';
    ct.posts.forEach((po,i)=>{
      h += '<div class="post"><b>Post '+(i+1)+' — visuel :</b> '+esc(po.visuel)+
        '<div class="accroche">« '+esc(po.accroche)+' »</div>'+
        '<div class="legende">'+esc(po.legende)+'</div>'+
        '<div class="hash">'+esc(po.hashtags)+'</div>'+
        '<div class="audio">🎵 '+esc(po.audio)+'</div></div>';
    });
    h += '<div class="note">'+esc(ct.noteVisuels)+'</div></section>';

    // 5) VIRAL
    const vi = d.viral;
    const link = (url,label) => '<a href="'+esc(url)+'" target="_blank" rel="noopener" style="color:var(--gold);font-weight:700;text-decoration:none">'+esc(label)+'</a>';
    h += '<section><h2>🔥 Inspiration virale</h2><p class="lead">'+esc(vi.statut)+'</p>';
    const reelsMa = vi.viralReelsMa || vi.viralReels;
    if(reelsMa || vi.viralReelsIntl || vi.viralUgc){
      const vcard = (e)=> '<div class="vitem">'+(e.origine?'<span class="vorig">'+esc(e.origine)+'</span> · ':'')+'<b>'+esc(e.titre)+'</b> · '+esc(e.compte)+'<div class="vstat">'+esc(e.stat)+'</div>'+
        (e.pourquoi?'<div class="vrow"><b>Pourquoi viral :</b> '+esc(e.pourquoi)+'</div>':'')+
        (e.message?'<div class="vrow"><b>Message clé :</b> '+esc(e.message)+'</div>':'')+
        (e.hook?'<div class="vrow"><b>Hook (&lt;3s) :</b> « '+esc(e.hook)+' »</div>':'')+
        (e.plans?'<div class="vrow"><b>Images · plans · scènes :</b> '+esc(e.plans)+'</div>':'')+
        (e.posture?'<div class="vrow"><b>Posture à adopter :</b> '+esc(e.posture)+'</div>':'')+
        (e.son?'<div class="vrow"><b>🎵 Son utilisé :</b> '+esc(e.son)+(e.sonLien?' · '+link(e.sonLien,'▶ écouter'):'')+'</div>':'')+
        link(e.lien,'▶ Voir le post réel')+'</div>';
      let leftCol = '<div class="vcol"><h3 style="color:var(--green)">📹 Reels modèles</h3>';
      if(reelsMa){ leftCol += '<h4 style="color:var(--green2);margin:8px 0 6px">🇲🇦 Agences Maroc ('+reelsMa.length+') — triés par vues ↓</h4>'+reelsMa.map(vcard).join(''); }
      if(vi.viralReelsIntl){ leftCol += '<div class="sep"></div><h4 style="color:var(--green2);margin:8px 0 6px">🌍 Agences & créateurs étrangers ('+vi.viralReelsIntl.length+') — triés par vues ↓</h4>'+vi.viralReelsIntl.map(vcard).join(''); }
      leftCol += '</div>';
      let rightCol = '<div class="vcol"><h3 style="color:var(--green)">🎬 UGC inspirants ('+((vi.viralUgc||[]).length)+')</h3>'+(vi.viralUgc||[]).map(vcard).join('')+'</div>';
      h += '<div class="viral2">'+leftCol+rightCol+'</div>';
      if(vi.ugcGardeFou){ h += '<div class="note">🛡️ <b>Garde-fou UGC :</b> '+esc(vi.ugcGardeFou)+'</div>'; }
      h += '<div class="sep"></div>';
    }
    if(vi.viralExamples){
      const catMeta = { ugc:['UGC','vtag-ugc'], reel:['Reel modèle','vtag-reel'], intl:['International','vtag-intl'] };
      const groups = [['ugc','🎬 UGC à reproduire (3)'],['reel','📹 Reels modèles (3)'],['intl','🌍 Viraux d\'autres pays — France & influenceurs (3)']];
      h += '<h3 style="color:var(--green)">🔗 Reels & posts à prendre comme modèles <span style="font-weight:400;font-size:13px;color:var(--muted)">(inspiration, pas plagiat)</span></h3>';
      const hasCat = vi.viralExamples.some(e=>e.cat);
      if(hasCat){
        groups.forEach(([cat,label])=>{
          const items = vi.viralExamples.filter(e=>e.cat===cat);
          if(!items.length) return;
          h += '<h4 style="color:var(--green2);margin:12px 0 6px">'+label+'</h4>';
          items.forEach(e=>{
            const m = catMeta[e.cat] || ['',''];
            h += '<div class="post"><span class="vtag '+m[1]+'">'+m[0]+'</span>'+(e.origine?'<span class="vorig">'+esc(e.origine)+'</span> · ':'')+'<b>'+esc(e.titre)+'</b> · '+esc(e.compte)+
              ' — <span style="color:var(--gold);font-weight:700">'+esc(e.stat)+'</span>'+
              '<div class="legende">'+esc(e.pourquoi)+'</div>'+link(e.lien,'▶ Voir le post réel')+'</div>';
          });
        });
      } else {
        vi.viralExamples.forEach(e=>{
          h += '<div class="post"><b>'+esc(e.titre)+'</b> · '+esc(e.compte)+' — <span style="color:var(--gold);font-weight:700">'+esc(e.stat)+'</span>'+
            '<div class="legende">'+esc(e.pourquoi)+'</div>'+link(e.lien,'▶ Voir le post réel')+'</div>';
        });
      }
      h += '<div class="sep"></div>';
    }
    if(vi.formats){
      h += '<h3 style="color:var(--green)">📱 Formats qui performent</h3><ul class="pill-list">'+vi.formats.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    }
    if(vi.hooks){
      h += '<div class="sep"></div><h3 style="color:var(--green)">🪝 Hooks scroll-stoppers (&lt; 3s)</h3><ul class="pill-list">'+vi.hooks.map(x=>'<li>« '+esc(x)+' »</li>').join('')+'</ul>';
    }
    if(vi.pistes){
      h += '<div class="sep"></div><h3 style="color:var(--green)">📱 Pistes de formats</h3><ul class="pill-list">'+vi.pistes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    }
    if(vi.pinterest){
      h += '<div class="sep"></div><h3 style="color:var(--green)">📌 Pinterest — stratégie</h3><ul class="pill-list">'+vi.pinterest.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    }
    if(vi.audio){
      h += '<div class="sep"></div><h3 style="color:var(--green)">🎵 Sons / musiques — liens d\'écoute</h3>'+(vi.audioNote?'<div class="note">'+esc(vi.audioNote)+'</div>':'')+'<ul class="pill-list">'+vi.audio.map(a=>{
        if(typeof a==='string') return '<li>'+esc(a)+'</li>';
        return '<li><b>'+esc(a.style)+'</b> — '+esc(a.usage)+' · '+link(a.lien,'▶ écouter')+'</li>';
      }).join('')+'</ul>';
    }
    if(vi.postsClesEnMain){
      h += '<div class="sep"></div><h3 style="color:var(--green)">⭐ Posts clés en main</h3>';
      vi.postsClesEnMain.forEach(p=>{
        if(p.script){
          h += '<div class="post">'+(p.format?'<span class="badge">'+esc(p.format)+'</span>':'')+'<b>'+esc(p.titre)+'</b>'+
            '<div class="row"><b>Langues :</b> '+esc(p.langues)+'</div>'+
            '<div class="row"><b>Script :</b> '+esc(p.script)+'</div>'+
            '<div class="row"><b>Direction visuelle :</b> '+esc(p.visuel)+'</div>'+
            '<div class="row"><b>Casting :</b> '+esc(p.casting)+'</div>'+
            '<div class="row"><b>Plan de tournage :</b> '+esc(p.tournage)+'</div>'+
            '<div class="row"><b>CTA :</b> '+esc(p.cta)+'</div>'+
            '<div class="row"><b>🎯 KPIs cibles :</b> '+esc(p.kpis)+'</div>'+
            (p.promptIA?'<div class="row" style="background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px;margin-top:8px"><b style="color:#7dd3fc">🤖 Prompt IA (Higgsfield / Flow / Gemini) — copier/coller :</b><br><span style="font-family:monospace;font-size:11.5px;line-height:1.5">'+esc(p.promptIA)+'</span></div>':'')+
            (p.musique?'<div class="row"><b>🎵 Musique de fond :</b> '+esc(p.musique)+(p.musiqueLien?' · '+link(p.musiqueLien,'▶ écouter / MP3'):'')+'</div>':'')+
            (p.lienCible?'<div class="audio">'+link(p.lienCible,'▶ Post-cible à reproduire')+'</div>':'')+
          '</div>';
        } else {
          h += '<div class="post"><b>'+esc(p.titre)+'</b><div class="legende">'+esc(p.detail||'')+'</div></div>';
        }
      });
    }
    h += '</section>';

    // 6) INFLUENCEURS / BLOGUEURS / YOUTUBEURS (par destination)
    if(d.influenceurs && d.influenceurs.length){
      h += '<section><h2>🎙️ Blogueurs · YouTubeurs · Influenceurs — '+esc(p.label)+'</h2><p class="lead">Les plus influents sur cette destination (4 🇲🇦 + 4 🇪🇺). Ce qu\'ils offrent / de quoi ils parlent.</p><div class="grid">';
      d.influenceurs.forEach(i=>{
        h += '<div class="infcard"><div class="flag">'+esc(i.origine)+'</div><h3>'+esc(i.nom)+'</h3>'+
          '<div class="row" style="color:var(--muted)">'+esc(i.plateforme)+' · '+esc(i.audience)+'</div>'+
          '<div class="row"><b>De quoi il/elle parle :</b> '+esc(i.sujet)+'</div>'+
          (i.lien?link(i.lien,'▶ Voir le compte'):'')+'</div>';
      });
      h += '</div></section>';
    }

    // 7) STRATÉGIE RÉSEAUX DÉCLINÉE À LA DESTINATION
    if(d.reseauxDest && d.reseauxDest.length){
      h += '<section><h2>📡 Stratégie réseaux — déclinée pour '+esc(p.label)+'</h2><p class="lead">'+esc(d.reseauxDestIntro||'Application concrète du playbook général à cette destination.')+'</p><div class="grid">';
      d.reseauxDest.forEach(r=>{
        h += '<div class="card"><h3>'+esc(r.nom)+'</h3>'+
          '<div class="row"><b>Stratégie :</b> '+esc(r.conseil)+'</div>'+
          (r.exemple?'<div class="row"><b>Exemple concret :</b> '+esc(r.exemple)+'</div>':'')+'</div>';
      });
      h += '</div><div class="note">Les règles de base par plateforme/web/vidéo sont dans la page « 📐 Règles & Playbook » du sélecteur.</div></section>';
    }

    app.innerHTML = h;
  }

  // PAGE — RÈGLES & PLAYBOOK (règles d'or générales)
  function renderPlaybook(d){
    let h = '<section><h2>📐 '+esc(d.titre)+'</h2><p class="lead">'+esc(d.intro)+'</p></section>';
    (d.blocs||[]).forEach(b=>{
      h += '<section><div class="pbblock"><h3>'+esc(b.titre)+'</h3>'+
        (b.regles?('<ul class="pill-list">'+b.regles.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'):'')+'</div></section>';
    });
    return h;
  }

  // PAGE — TENDANCES & NICHES
  function renderTendances(d){
    const link = (url,label) => url ? '<a href="'+esc(url)+'" target="_blank" rel="noopener" style="color:var(--gold);font-weight:700">'+esc(label)+'</a>' : '';
    let h = '<section><h2>🔥 '+esc(d.titre)+'</h2><p class="lead">'+esc(d.intro)+'</p></section>';
    if(d.top10){
      h += '<section><h2>🏆 Top 10 destinations tendances (influenceurs MA + Europe)</h2>';
      d.top10.forEach((t,i)=>{
        h += '<div class="trend"><span class="rank">'+(i+1)+'.</span><b>'+esc(t.dest)+'</b>'+(t.nouveau?' <span class="newdest">⚡ NON programmée chez V21</span>':'')+
          '<div class="row"><b>Comment ils en parlent (appâts) :</b> '+esc(t.appat)+'</div>'+
          '<div class="row"><b>Mon analyse :</b> '+esc(t.analyse)+'</div></div>';
      });
      h += '</section>';
    }
    if(d.croisieres){
      h += '<section><h2>🚢 Croisières SANS visa Schengen (cible MA)</h2><p class="lead">'+esc(d.croisieresIntro||'')+'</p><div class="grid">';
      d.croisieres.forEach(c=>{
        h += '<div class="card"><h3>'+esc(c.nom)+'</h3><div class="row"><b>Visa :</b> '+esc(c.visa)+'</div><div class="row">'+esc(c.note)+'</div>'+(c.lien?link(c.lien,'▶ Exemple'):'')+'</div>';
      });
      h += '</div></section>';
    }
    if(d.reco){
      h += '<section><div class="analyse"><h4>🎯 Sur quoi miser — ma recommandation (succès web/réseaux)</h4><ul>'+d.reco.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></section>';
    }
    return h;
  }

  // 6) QUESTIONS (toujours affichées en bas, communes au projet)
  function renderQuestions(){
    let h = '<section><h2>❓ Questions de Claude → réponses attendues de Karim</h2><p class="lead">Donne-moi ces éléments (ici dans le chat) pour le meilleur livrable.</p>';
    D.questions.forEach(q=>{ h += '<div class="qbox"><span class="st">'+esc(q.statut)+'</span><br>'+esc(q.q)+'</div>'; });
    h += '</section>';
    return h;
  }

  function full(){ const id=sel.value; const d=D[id]; render(id); if(!(d&&d.type)){ app.innerHTML += renderQuestions(); } }
  sel.addEventListener('change', full);
  full();
</script>

<script>
(function(){
  var KEY='v21chat-history-v2';
  var fab=document.getElementById('v21chat-fab');
  var box=document.getElementById('v21chat');
  var msgs=document.getElementById('v21chat-msgs');
  var inp=document.getElementById('v21chat-input');
  var sendBtn=document.getElementById('v21chat-send');
  var hist=[];
  try{ hist=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ hist=[]; }

  // ── Utilitaires ──────────────────────────────────────────────────────────
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(hist.slice(-40))); }catch(e){} }

  function escHtml(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function b64enc(str){ try{ return btoa(unescape(encodeURIComponent(str))); }catch(e){ return btoa(str); } }
  function b64dec(b64){ try{ return decodeURIComponent(escape(atob(b64))); }catch(e){ return atob(b64); } }

  function copyText(text){
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).catch(function(){ legacyCopy(text); });
    } else { legacyCopy(text); }
  }
  function legacyCopy(text){
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  // ── Renderer Markdown + cartes V21 ──────────────────────────────────────
  function renderMarkdown(raw){
    var medias=[]; var codes=[];

    // 1. Extraire marqueurs [V21:TYPE:b64]
    var text=raw.replace(/\[V21:([A-Z]+):([A-Za-z0-9+\/=]+)\]/g, function(_,type,b64){
      try{
        var d=JSON.parse(b64dec(b64));
        d._vtype=type;
        medias.push(d);
        return '\x00M'+(medias.length-1)+'\x00';
      }catch(e){ return ''; }
    });

    // 2. Extraire blocs de code ``` ... ```
    text=text.replace(/```(?:[a-z]*)?\n?([\s\S]*?)```/g, function(_,code){
      var raw=code.trim();
      codes.push(raw);
      return '\x01C'+(codes.length-1)+'\x01';
    });

    // 3. Échapper HTML
    var h=escHtml(text);

    // 4. Markdown inline
    h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    h=h.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    h=h.replace(/`([^`]+)`/g,'<code>$1</code>');

    // 5. Listes
    h=h.replace(/^[-•] (.+)$/gm,'<li>$1</li>');
    h=h.replace(/(<li>[\s\S]*?<\/li>\n?)+/g,function(m){ return '<ul>'+m+'</ul>'; });

    // 6. Sauts de ligne → paragraphes
    h=h.split(/\n\n+/).map(function(p){ return '<p>'+p.replace(/\n/g,'<br>')+'</p>'; }).join('');

    // 7. Restaurer blocs de code
    h=h.replace(/\x01C(\d+)\x01/g,function(_,idx){
      var raw=codes[parseInt(idx)];
      var b64=b64enc(raw);
      return '<div class="v21-code-wrap"><pre><code>'+escHtml(raw)+'</code></pre>'
        +'<button class="v21-copy-btn" data-cb64="'+b64+'">✂ Copier</button></div>';
    });

    // 8. Restaurer cartes médias
    h=h.replace(/\x00M(\d+)\x00/g,function(_,idx){
      return buildMediaCard(medias[parseInt(idx)]);
    });

    return h;
  }

  function buildMediaCard(d){
    if(!d) return '';
    var vt=d._vtype||'';

    if(vt==='HFPROMPT'){
      var isVideo=(d.type==='hf_video_prompt');
      var promptB64=b64enc(d.prompt||'');
      var ratio=d.aspect_ratio||'9:16';
      var genId='hfgen-'+Math.random().toString(36).slice(2,9);
      return '<div class="hf-card">'
        +'<div class="hf-badge">'+(isVideo?'🎥 Vidéo':'🖼 Image')+' · Higgsfield</div>'
        +'<div class="hf-meta"><b>Modèle&nbsp;:</b> '+escHtml(d.model||'')+' &nbsp;·&nbsp; <b>Format&nbsp;:</b> '+escHtml(ratio)+(isVideo?' · '+(d.duration||5)+'s':'')+' </div>'
        +'<div class="hf-prompt">'+escHtml(d.prompt||'')+'</div>'
        +(d.notes?'<div class="hf-notes">💡 '+escHtml(d.notes)+'</div>':'')
        +'<button class="hf-gen-btn" data-genprompt="'+promptB64+'" data-genratio="'+escHtml(ratio)+'" data-gentarget="'+genId+'">🎬 Générer la vidéo sur la plateforme</button>'
        +'<button class="hf-copy-btn" data-cb64="'+promptB64+'">✂ Copier le prompt</button>'
        +'<div class="hf-result" id="'+genId+'"></div>'
        +'</div>';
    }

    if(vt==='VIDEO'){
      return '<div class="media-card"><video controls playsinline src="'+escHtml(d.url||'')+'"></video>'
        +'<a class="dl-btn" href="'+escHtml(d.url||'')+'" download>⬇ Télécharger</a></div>';
    }

    if(vt==='IMAGE'){
      return '<div class="media-card"><img src="'+escHtml(d.url||'')+'" alt="'+escHtml(d.alt||'Visuel')+'"/>'
        +'<a class="dl-btn" href="'+escHtml(d.url||'')+'" download>⬇ Télécharger</a></div>';
    }

    return '';
  }

  // ── Bulles ──────────────────────────────────────────────────────────────
  function bubble(role,text,rendered){
    var d=document.createElement('div');
    d.className='ch-b '+(role==='user'?'me':'ai');
    if(role==='user'){
      d.textContent=text;
    } else if(rendered){
      d.innerHTML=rendered;
    } else {
      d.textContent=text; // pendant le streaming
    }
    msgs.appendChild(d);
    msgs.scrollTop=msgs.scrollHeight;
    return d;
  }

  function hint(){
    if(hist.length) return;
    var h=document.createElement('div');
    h.className='ch-hint';
    h.textContent='👋 Salut Karim. Priorité : Égypte. Demande des accroches, un plan de posts, génère un visuel Higgsfield, ou scanne un compte concurrent.';
    msgs.appendChild(h);
  }

  function paint(){
    msgs.innerHTML='';
    hint();
    hist.forEach(function(m){
      bubble(m.role,m.content, m.role==='assistant'?renderMarkdown(m.content):null);
    });
  }
  paint();

  // ── Delegation clics : copier + générer vidéo ───────────────────────────
  msgs.addEventListener('click',function(e){
    var copyBtn=e.target.closest('[data-cb64]');
    if(copyBtn){
      copyText(b64dec(copyBtn.dataset.cb64));
      var orig=copyBtn.textContent;
      copyBtn.textContent='✓ Copié !';
      setTimeout(function(){ copyBtn.textContent=orig; },2000);
      return;
    }
    var genBtn=e.target.closest('[data-genprompt]');
    if(genBtn){ generateVideo(genBtn); return; }
  });

  // ── Génération vidéo Higgsfield (sur la plateforme) ─────────────────────
  async function generateVideo(btn){
    if(btn.disabled) return;
    var prompt=b64dec(btn.dataset.genprompt||'');
    var ratio=btn.dataset.genratio||'9:16';
    var target=document.getElementById(btn.dataset.gentarget);
    if(!prompt||!target) return;

    btn.disabled=true;
    var steps=['🎨 Étape 1/2 — création de l\'image…','🎬 Étape 2/2 — animation en vidéo…','⏳ Rendu final… (1 à 3 min, ne ferme pas)'];
    var si=0;
    target.innerHTML='<div class="hf-progress"><div class="hf-spinner"></div><span>'+steps[0]+'</span></div>';
    var span=target.querySelector('span');
    var ticker=setInterval(function(){ si=Math.min(si+1,steps.length-1); if(span) span.textContent=steps[si]; },18000);

    try{
      var res=await fetch('/api/studio-video',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({prompt:prompt, aspect_ratio:ratio})
      });
      clearInterval(ticker);
      var j=await res.json().catch(function(){return{};});

      if(!res.ok){
        target.innerHTML='<div class="hf-err">⚠️ '+escHtml(j.error||('Erreur '+res.status))+'</div>';
        btn.disabled=false; btn.textContent='🔁 Réessayer';
        return;
      }

      var html='';
      if(j.videoUrl){
        html+='<video controls playsinline src="'+escHtml(j.videoUrl)+'"></video>';
        html+='<a class="dl-btn" href="'+escHtml(j.videoUrl)+'" download>⬇ Télécharger la vidéo</a>';
      }
      if(j.imageUrl){
        html+='<a class="dl-btn" href="'+escHtml(j.imageUrl)+'" download style="background:#fff;color:var(--green);border:1px solid var(--gold)">⬇ Image</a>';
      }
      if(j.error){ html+='<div class="hf-err" style="margin-top:7px">⚠️ '+escHtml(j.error)+'</div>'; }
      if(!html){ html='<div class="hf-err">Aucun média renvoyé.</div>'; }
      target.innerHTML=html;
      btn.textContent='✓ Vidéo générée';
      msgs.scrollTop=msgs.scrollHeight;

    }catch(err){
      clearInterval(ticker);
      target.innerHTML='<div class="hf-err">⚠️ Connexion interrompue : '+escHtml(String(err&&err.message||err))+'. La génération a pu être trop longue — réessaie.</div>';
      btn.disabled=false; btn.textContent='🔁 Réessayer';
    }
  }

  // ── Ouverture / fermeture ────────────────────────────────────────────────
  function openChat(){ box.classList.add('open'); fab.style.display='none'; inp.focus(); }
  function closeChat(){ box.classList.remove('open'); fab.style.display='block'; }
  fab.addEventListener('click',openChat);
  document.getElementById('v21chat-x').addEventListener('click',closeChat);
  document.getElementById('v21chat-reset').addEventListener('click',function(){
    hist=[]; save(); paint();
  });

  inp.addEventListener('input',function(){
    inp.style.height='auto';
    inp.style.height=Math.min(inp.scrollHeight,110)+'px';
  });
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); go(); }
  });
  sendBtn.addEventListener('click',go);

  function currentProduct(){
    var s=document.getElementById('sel');
    if(!s) return '';
    var o=s.options[s.selectedIndex];
    return o?o.textContent.trim():'';
  }

  // ── Envoi message ────────────────────────────────────────────────────────
  async function go(){
    var txt=inp.value.trim();
    if(!txt||sendBtn.disabled) return;
    inp.value=''; inp.style.height='auto';

    hist.push({role:'user',content:txt}); save();
    var hintEl=msgs.querySelector('.ch-hint'); if(hintEl) hintEl.remove();
    bubble('user',txt);
    sendBtn.disabled=true;

    // Bulle assistant en attente
    var out=bubble('assistant','…');
    var acc='';

    try{
      var res=await fetch('/api/studio-chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:hist.slice(-24), currentProduct:currentProduct()})
      });

      if(!res.ok){
        var j=await res.json().catch(function(){return{};});
        out.textContent='⚠️ '+(j.error||('Erreur HTTP '+res.status));
        sendBtn.disabled=false; return;
      }

      var reader=res.body.getReader();
      var dec=new TextDecoder();
      out.textContent='';

      while(true){
        var r=await reader.read();
        if(r.done) break;
        acc+=dec.decode(r.value,{stream:true});
        // Streaming : texte brut (rapide, sans parse)
        out.textContent=acc;
        msgs.scrollTop=msgs.scrollHeight;
      }

      // Stream terminé : rendu enrichi (markdown + cartes Higgsfield/médias)
      out.innerHTML=renderMarkdown(acc);
      msgs.scrollTop=msgs.scrollHeight;

      hist.push({role:'assistant',content:acc||'(réponse vide)'}); save();

    }catch(e){
      out.textContent='⚠️ Connexion impossible : '+(e&&e.message||e);
    }finally{
      sendBtn.disabled=false; inp.focus();
    }
  }

})();
</script>
</body>
</html>
