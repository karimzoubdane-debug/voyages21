<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>HAJJ 2027 — Voyages 21</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&family=Noto+Naskh+Arabic:wght@500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #cdc7b8; display: flex; align-items: center; justify-content: center; }
    .square { width: 1080px; height: 1080px; position: relative; overflow: hidden;
        background: radial-gradient(120% 120% at 50% 0%, #235138 0%, #1B3A28 45%, #122619 100%);
        font-family: 'Noto Naskh Arabic', serif; color: #fff; }

    /* cadre doré */
    .frame { position: absolute; inset: 34px; border: 2px solid rgba(200,164,64,.55); border-radius: 22px; }
    .frame::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(200,164,64,.28); border-radius: 16px; }

    .pad { position: absolute; inset: 0; padding: 92px 84px 80px; display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 3; }

    /* top */
    .top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .brand { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 40px; letter-spacing: .04em; color: #fff; }
    .brand small { display: block; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .22em; color: #E4D2A0; margin-top: 4px; }
    .label { width: 132px; background: #fff; border-radius: 14px; padding: 8px; }
    .label img { width: 100%; display: block; }

    /* center */
    .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .eyebrow { color: #E4D2A0; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .12em; }
    .ar-title { font-size: 150px; font-weight: 700; line-height: .95; text-shadow: 0 6px 30px rgba(0,0,0,.35); }
    .en-title { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 92px; color: #C8A440; letter-spacing: .06em; margin-top: 2px; }
    .hijri { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 26px; color: #fff; opacity: .85; margin-top: 6px; }
    .slogan { margin-top: 26px; font-size: 40px; font-weight: 700; color: #fff; }
    .slogan small { display: block; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 22px; color: #E4D2A0; margin-top: 10px; }

    /* bottom */
    .bottom { width: 100%; }
    .gold-line { height: 2px; width: 220px; background: #C8A440; margin: 0 auto 22px; border-radius: 2px; }
    .accred { font-size: 28px; font-weight: 700; color: #fff; }
    .contact { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 26px; color: #E4D2A0; margin-top: 14px; letter-spacing: .02em; }
    .contact .num { direction: ltr; unicode-bidi: isolate; }

    /* silhouette */
    .silhouette { position: absolute; left: 0; right: 0; bottom: 0; height: 360px; z-index: 1; opacity: .16; }
    .silhouette svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="square">
    <div class="silhouette">
        <svg viewBox="0 0 1080 360" preserveAspectRatio="xMidYMax meet" fill="#E4D2A0">
            <rect x="120" y="200" width="160" height="160"/>
            <rect x="150" y="160" width="100" height="60"/>
            <circle cx="200" cy="150" r="46"/>
            <rect x="196" y="60" width="8" height="60"/>
            <circle cx="200" cy="56" r="9"/>
            <rect x="470" y="150" width="140" height="210"/>
            <path d="M470 150 q70 -90 140 0 Z"/>
            <rect x="430" y="120" width="14" height="240"/>
            <rect x="636" y="120" width="14" height="240"/>
            <circle cx="437" cy="110" r="12"/>
            <circle cx="643" cy="110" r="12"/>
            <rect x="820" y="220" width="150" height="140"/>
            <rect x="850" y="180" width="90" height="50"/>
            <circle cx="895" cy="170" r="40"/>
            <rect x="891" y="95" width="8" height="55"/>
            <circle cx="895" cy="90" r="8"/>
        </svg>
    </div>

    <div class="frame"></div>

    <div class="pad">
        <div class="top">
            <div class="brand">VOYAGES 21<small>أسفار 21</small></div>
            <div class="label"><img src="label-qualite-hajj.jpg" alt="علامة جودة خدمات الحج"></div>
        </div>

        <div class="center">
            <div class="eyebrow">المملكة المغربية · موسم الحج</div>
            <div class="ar-title">الحَجّ</div>
            <div class="en-title">HAJJ 2027</div>
            <div class="hijri">1448 هـ</div>
            <div class="slogan">أنتم للعبادة… ونحن للتنظيم
                <small dir="ltr">La dévotion pour vous, l'organisation pour nous.</small>
            </div>
        </div>

        <div class="bottom">
            <div class="gold-line"></div>
            <div class="accred">وكالة معتمدة بعلامة جودة خدمات الحج منذ 2006</div>
            <div class="contact">www.voyages21.com · <span class="num">0614 15 26 86</span></div>
        </div>
    </div>
</div>
</body>
</html>
