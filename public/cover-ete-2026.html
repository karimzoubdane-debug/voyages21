<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOYAGES21 - Evasions Ete 2026</title>
<style>
:root{--gold:#C8A440;--cream:#F8F1E4;--ink:#14110c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#080806;color:#fff;font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.cover{position:relative;min-height:100svh;overflow:hidden;background:#080806;isolation:isolate}.stage{position:absolute;inset:0;z-index:0;background:#080806}.layer{position:absolute;inset:0;opacity:0;transition:opacity .85s ease;background:#080806}.layer.active{opacity:1}.layer-media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.layer-bg{position:absolute;inset:-1.5%;background:center/cover no-repeat;filter:blur(6px) saturate(1.03) brightness(.94);transform:scale(1.03);opacity:.44}.layer img,.layer video{position:relative;z-index:1;width:100%;height:100%;display:block;filter:contrast(1.03) saturate(1.04);animation:none}.layer img{object-fit:contain;transform:scale(var(--cover-scale,1.22));will-change:transform}.layer video{object-fit:cover;transform:scale(1.015);background:#080806}.layer.active img{animation:imageReveal var(--reveal-ms,3900ms) cubic-bezier(.16,.84,.22,1) forwards}.layer.active video{animation:videoSettle 1.8s ease-out forwards}
.texture{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.035;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mix-blend-mode:soft-light}.veil{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,0) 42%,rgba(0,0,0,.26)),radial-gradient(circle at 50% 46%,rgba(0,0,0,0),rgba(0,0,0,.16) 80%)}
.brand{position:absolute;z-index:3;top:24px;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.12em;font-family:"Playfair Display",Georgia,serif;font-weight:700}.brand span{color:var(--gold)}.brand small{display:block;margin-top:3px;color:rgba(255,255,255,.72);font:600 .53rem/1 "DM Sans",sans-serif;letter-spacing:.32em;text-transform:uppercase}
.copy{position:absolute;z-index:3;left:50%;top:50%;width:min(620px,calc(100% - 34px));transform:translate(-50%,-50%);text-align:center;padding:clamp(1.15rem,3vw,2.15rem) clamp(1.25rem,4vw,3rem);border:1px solid rgba(255,255,255,.48);border-radius:2px;background:rgba(248,241,228,.72);box-shadow:0 22px 70px rgba(0,0,0,.22);backdrop-filter:blur(4px);transition:opacity .28s ease,transform .28s ease}.copy.is-changing{opacity:.2;transform:translate(-50%,-46%)}.eyebrow{margin:0 0 .35rem;color:#0f3324;font-size:clamp(.76rem,1.9vw,1.08rem);font-weight:900;letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;color:#111;font-family:"Playfair Display",Georgia,serif;font-size:clamp(2.45rem,6vw,5.35rem);font-weight:800;line-height:.95;text-shadow:none}.subtitle{margin:.55rem auto 0;max-width:620px;color:#0f3324;font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:clamp(1.25rem,3.6vw,2.45rem);font-weight:900;letter-spacing:.04em;line-height:1.05;text-transform:uppercase}
.magic-button{position:absolute;z-index:4;left:50%;bottom:clamp(32px,7vh,72px);transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.85rem 1.45rem;border:1px solid rgba(255,255,255,.58);border-radius:999px;background:rgba(10,10,8,.34);color:#fff;text-decoration:none;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(14px);box-shadow:0 10px 38px rgba(0,0,0,.28);transition:background .18s,color .18s,border-color .18s}.magic-button:hover{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.sound{position:absolute;right:18px;bottom:18px;z-index:5;width:42px;height:42px;border:1px solid rgba(255,255,255,.42);border-radius:999px;background:rgba(10,10,8,.34);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(14px);font-size:1rem}.sound.show{display:flex}.sound.on{background:rgba(200,164,64,.88);color:#111;border-color:rgba(200,164,64,.88)}
.brochure-shell{display:none;position:relative;min-height:100svh;background:#f6f0e7;color:var(--ink)}.show-brochure .cover{display:none}.show-brochure .brochure-shell{display:block}.brochure-shell iframe{display:block;width:100%;height:calc(100svh - 38px);border:0;background:#f6f0e7}.brochure-tools{height:38px;display:flex;align-items:center;justify-content:center;background:#102416;border-bottom:1px solid rgba(200,164,64,.28)}.back-cover{display:inline-flex;align-items:center;justify-content:center;min-height:26px;padding:.35rem .72rem;border:1px solid rgba(20,17,12,.18);border-radius:4px;background:var(--gold);color:var(--ink);text-decoration:none;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:none;transition:filter .18s}.back-cover:hover{filter:brightness(.94)}
.fallback-note{display:none;background:var(--cream);color:var(--ink);padding:2rem;font-size:.95rem}@keyframes imageReveal{0%{transform:scale(var(--cover-scale,1.22))}76%,100%{transform:scale(1)}}@keyframes videoSettle{0%{transform:scale(1.015)}100%{transform:scale(1)}}@media(max-width:720px){.brand{top:18px}.copy{top:48%;padding:1rem 1.1rem}.eyebrow{font-size:.74rem}h1{font-size:clamp(2.05rem,12vw,3.75rem)}.subtitle{font-size:clamp(1.1rem,7vw,1.7rem)}.magic-button{width:calc(100% - 36px);max-width:360px;text-align:center;letter-spacing:.08em}.sound{bottom:12px;right:12px;width:38px;height:38px}.brochure-tools{height:36px}.brochure-shell iframe{height:calc(100svh - 36px)}.back-cover{min-height:24px;padding:.3rem .62rem;font-size:.6rem}}@media(prefers-reduced-motion:reduce){.layer{transition:opacity .2s ease}.layer.active img,.layer.active video{animation:none;transform:scale(1)}}
</style>
</head>
<body>
<main class="cover" id="cover" aria-label="Cover brochure VOYAGES21">
  <div class="stage">
    <div class="layer" id="layerA"></div>
    <div class="layer" id="layerB"></div>
  </div>
  <div class="texture"></div>
  <div class="veil"></div>
  <div class="brand">VOYAGES<span>21</span><small>Le voyage cousu main</small></div>
  <section class="copy">
    <p class="eyebrow" id="eyebrow">BROCHURE VOYAGES21</p>
    <h1 id="title">EVASIONS ETE 2026</h1>
    <p class="subtitle" id="subtitle">La selection voyages de VOYAGES 21</p>
  </section>
  <a class="magic-button" id="magicButton" href="/design/homepage-v2-luxe.html">Votre bonheur commence ici</a>
  <button class="sound" id="soundButton" type="button" aria-label="Activer le son" title="Activer le son">OFF</button>
  <audio id="coverAudio" loop preload="none"></audio>
</main>
<section class="brochure-shell" id="brochure" aria-label="Brochure VOYAGES21 Ete 2026">
  <div class="brochure-tools">
    <a class="back-cover" href="#cover" id="backCover">Revoir l'intro</a>
  </div>
  <iframe id="brochureFrame" title="Brochure VOYAGES21 Ete 2026" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</section>
<section class="fallback-note">Emplacement reserve a l'integration de la brochure dans la meme page.</section>
<script>
const DEFAULT_COVER={eyebrow:"BROCHURE VOYAGES21",title:"EVASIONS ETE 2026",subtitle:"La selection voyages de VOYAGES 21",buttonText:"Votre bonheur commence ici",buttonUrl:"/design/homepage-v2-luxe.html",audio:{url:""},media:[{type:"image",url:"https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1800&q=85",duration:4},{type:"image",url:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=85",duration:4},{type:"image",url:"https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?auto=format&fit=crop&w=1800&q=85",duration:4},{type:"image",url:"https://images.unsplash.com/photo-1506929562872-bb421503ef21?auto=format&fit=crop&w=1800&q=85",duration:4}]};
let cover=DEFAULT_COVER,media=[],index=0,active=0,timer=null,audioReady=false,brochureLoaded=false;
const layers=[document.getElementById("layerA"),document.getElementById("layerB")],audio=document.getElementById("coverAudio"),soundButton=document.getElementById("soundButton"),magicButton=document.getElementById("magicButton"),brochureFrame=document.getElementById("brochureFrame"),backCover=document.getElementById("backCover"),offerCard=document.querySelector(".copy"),eyebrowEl=document.getElementById("eyebrow"),titleEl=document.getElementById("title"),subtitleEl=document.getElementById("subtitle");
const COVER_OFFERS=[{match:/sharam|sharm|caire/i,title:"Le Caire & Sharm El Sheikh",price:"19 300 DH"},{match:/istanbul.*bodrum|bodrum.*istanbul/i,title:"Istanbul & Bodrum",price:"16 900 DH"},{match:/rome|venice|venise|ital/i,title:"Circuit Italie",price:"21 500 DH"},{match:/untitled|chine|china|great.wall|grande.muraille/i,title:"Chine",price:"29 900 DH"},{match:/ha.long|halong|vietnam/i,title:"Vietnam",price:"33 900 DH"}];
async function getCover(){const fromUrl=readCoverFromUrl();if(fromUrl)return fromUrl;try{const r=await fetch("/api/cover",{cache:"no-store"});if(!r.ok)throw new Error("api");const d=await r.json();writeLocalCover(d);return d}catch(e){return readLocalCover()||DEFAULT_COVER}}
function normalizeCover(data){if(data&&data.cover)data=data.cover;const c=Object.assign({},DEFAULT_COVER,data||{});if(Array.isArray(data?.media))c.media=data.media;else if(Array.isArray(data?.images))c.media=data.images.map(x=>({type:"image",url:x.url,duration:6}));c.media=(Array.isArray(c.media)?c.media:DEFAULT_COVER.media).filter(m=>m&&m.url).map(m=>({type:m.type==="video"?"video":"image",url:m.url,localId:m.localId||"",poster:m.poster||"",name:m.name||"",duration:Number(m.duration||6)||6}));if(!c.media.length)c.media=DEFAULT_COVER.media;c.audio=Object.assign({url:""},data?.audio||{});return c}
function readCoverFromUrl(){const hash=window.location.hash||"";const marker="#cover=";if(!hash.startsWith(marker))return null;try{return JSON.parse(decodeURIComponent(escape(atob(hash.slice(marker.length)))))}catch(e){return null}}
function readLocalCover(){const raw=localStorage.getItem("v21_cover_shared")||localStorage.getItem("v21_cover_draft")||sessionStorage.getItem("v21_cover_draft");if(!raw)return null;try{return JSON.parse(raw)}catch(e){return null}}
function writeLocalCover(data){const payload=data&&data.cover?data.cover:data;const json=JSON.stringify(payload);localStorage.setItem("v21_cover_draft",json);localStorage.setItem("v21_cover_shared",json);try{sessionStorage.setItem("v21_cover_draft",json)}catch(e){}}
function openMediaDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open("v21_cover_media",1);req.onupgradeneeded=()=>req.result.createObjectStore("files");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getLocalBlobUrl(id){const db=await openMediaDb();const blob=await new Promise((resolve,reject)=>{const tx=db.transaction("files","readonly");const req=tx.objectStore("files").get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();return blob?URL.createObjectURL(blob):""}
async function resolveMediaUrl(item){if(item.url&&item.url.startsWith("localblob:"))return await getLocalBlobUrl(item.url.slice(10));return item.url||""}
function offerFor(item){const key=[item?.name,item?.url].filter(Boolean).join(" ");return COVER_OFFERS.find(o=>o.match.test(key))||{title:"Evasions Ete 2026",price:""}}
function renderOffer(item){const offer=offerFor(item);offerCard.classList.add("is-changing");setTimeout(()=>{eyebrowEl.textContent=offer.price?"A partir de":"Voyages 21";titleEl.textContent=offer.title;subtitleEl.textContent=offer.price||"La selection voyages de VOYAGES 21";offerCard.classList.remove("is-changing")},120)}
function renderText(c){magicButton.textContent=c.buttonText||DEFAULT_COVER.buttonText;magicButton.href="#brochure"}
function escapeCssUrl(value){return String(value||"").replace(/"/g,"%22")}
function imageCoverScale(img){const vw=Math.max(1,window.innerWidth),vh=Math.max(1,window.innerHeight),iw=img.naturalWidth||vw,ih=img.naturalHeight||vh;const contain=Math.min(vw/iw,vh/ih),cover=Math.max(vw/iw,vh/ih);return Math.max(1.08,Math.min(2.35,cover/contain*1.025))}
function loadImageElement(img){return new Promise(resolve=>{if(img.complete&&img.naturalWidth){resolve();return}img.onload=()=>resolve();img.onerror=()=>resolve()})}
function loadVideoElement(video){return new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve()};video.addEventListener("loadeddata",finish,{once:true});video.addEventListener("loadedmetadata",finish,{once:true});video.addEventListener("error",finish,{once:true});setTimeout(finish,1200)})}
async function paintLayer(layer,item){layer.innerHTML="";const src=await resolveMediaUrl(item);const poster=item.poster?await resolveMediaUrl({url:item.poster}):src;const bg=document.createElement("div");bg.className="layer-bg";bg.style.backgroundImage=`url("${escapeCssUrl(poster)}")`;const frame=document.createElement("div");frame.className="layer-media";if(item.type==="video"){const v=document.createElement("video");v.src=src;v.muted=true;v.defaultMuted=true;v.playsInline=true;v.autoplay=true;v.preload="auto";v.loop=true;if(item.poster)v.poster=poster;frame.appendChild(v);layer.appendChild(bg);layer.appendChild(frame);await loadVideoElement(v);v.play().catch(()=>{})}else{const img=document.createElement("img");img.src=src;img.alt="";img.decoding="async";frame.appendChild(img);layer.appendChild(bg);layer.appendChild(frame);await loadImageElement(img);img.style.setProperty("--cover-scale",imageCoverScale(img).toFixed(3));img.style.setProperty("--reveal-ms",`${Math.max(3300,Math.min(5600,Number(item.duration||4)*720))}ms`)}}
async function showCurrent(){clearTimeout(timer);const item=media[index%media.length],next=layers[1-active],current=layers[active];renderOffer(item);await paintLayer(next,item);next.classList.remove("active");void next.offsetWidth;requestAnimationFrame(()=>{current.classList.remove("active");next.classList.add("active");active=1-active});const ms=Math.max(4200,Math.min(8500,Number(item.duration||4.2)*1000));timer=setTimeout(()=>{index=(index+1)%media.length;showCurrent()},ms)}
function setupAudio(c){if(!c.audio?.url)return;audio.src=c.audio.url;audioReady=true;soundButton.classList.add("show")}
function brochureUrl(){return cover.buttonUrl||DEFAULT_COVER.buttonUrl}
function loadBrochure(){const url=brochureUrl();if(!brochureLoaded||brochureFrame.src!==url){brochureFrame.src=url;brochureLoaded=true}}
function goBrochure(){loadBrochure();if(!audio.paused)toggleSound();document.body.classList.add("show-brochure");window.scrollTo(0,0);history.replaceState(null,"","#brochure")}
function goCover(){document.body.classList.remove("show-brochure");window.scrollTo(0,0);history.replaceState(null,"","#cover")}
async function toggleSound(){if(!audioReady)return;if(audio.paused){try{await audio.play();soundButton.textContent="ON";soundButton.classList.add("on");soundButton.setAttribute("aria-label","Couper le son");soundButton.title="Couper le son"}catch(e){}}else{audio.pause();soundButton.textContent="OFF";soundButton.classList.remove("on");soundButton.setAttribute("aria-label","Activer le son");soundButton.title="Activer le son"}}
soundButton.addEventListener("click",toggleSound);
magicButton.addEventListener("click",e=>{e.preventDefault();goBrochure()});
backCover.addEventListener("click",e=>{e.preventDefault();goCover()});
getCover().then(async data=>{cover=normalizeCover(data);media=cover.media;renderText(cover);renderOffer(media[0]);await paintLayer(layers[0],media[0]);setupAudio(cover);requestAnimationFrame(()=>layers[0].classList.add("active"));timer=setTimeout(()=>{index=1%media.length;showCurrent()},Math.max(4200,Number(media[0].duration||4.2)*1000));if(location.hash==="#brochure")setTimeout(goBrochure,250)});
</script>
</body>
</html>
