name: Sauvegarde Voyages21

# Genere une sauvegarde complete du site :
#  - voyages21-site-<date>.zip          : tous les fichiers du site (etat de main)
#  - voyages21-SAUVEGARDE-<date>.bundle : depot git complet (tout l'historique)
#  - medias-manifest-<date>.json        : liste/liens des medias (photos/videos) du site en ligne
# Les fichiers sont publies en Release (telechargement permanent) + en artefact (90 jours).

on:
  push:
    branches: [ main ]          # a chaque PR fusionnee sur main
  schedule:
    - cron: '0 3 * * 1'         # filet de securite : tous les lundis a 03:00 UTC
  workflow_dispatch: {}          # bouton "Run workflow" manuel

permissions:
  contents: write                # necessaire pour creer la Release

concurrency:
  group: sauvegarde-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    env:
      # Active le depot automatique dans Google Drive si le secret est configure
      HAS_GDRIVE: ${{ secrets.GDRIVE_SA_JSON != '' }}
    steps:
      - name: Recuperer le depot (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Date du jour
        id: d
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generer les fichiers de sauvegarde
        run: |
          set -e
          mkdir -p backup
          DATE="${{ steps.d.outputs.date }}"
          # 1) Depot git complet (toutes branches + historique)
          git bundle create "backup/voyages21-SAUVEGARDE-$DATE.bundle" --all
          # 2) Tous les fichiers du site (etat actuel)
          git archive --format=zip -o "backup/voyages21-site-$DATE.zip" HEAD
          # 3) Manifeste des medias depuis le site en ligne (best effort)
          curl -fsSL https://www.voyages21.com/api/media -o "backup/medias-manifest-$DATE.json" \
            || echo '{"info":"manifest indisponible au moment de la sauvegarde"}' > "backup/medias-manifest-$DATE.json"
          ls -lh backup/

      - name: Publier en artefact (telechargeable 90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: voyages21-sauvegarde-${{ steps.d.outputs.date }}
          path: backup/
          retention-days: 90

      - name: Publier une Release (telechargement permanent)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sauvegarde-${{ steps.d.outputs.date }}-${{ github.run_number }}
          name: Sauvegarde ${{ steps.d.outputs.date }}
          body: |
            Sauvegarde automatique du site Voyages21 (${{ steps.d.outputs.date }}).
            - voyages21-site-*.zip : tous les fichiers du site, prets a redeployer.
            - voyages21-SAUVEGARDE-*.bundle : depot git complet + historique (git clone le .bundle).
            - medias-manifest-*.json : liste/liens des medias.
            A telecharger et a deposer dans le Drive "VOYAGES21 — SAUVEGARDES".
          make_latest: true
          files: backup/*

      # Depot AUTOMATIQUE dans Google Drive (sans aucune manip), si le secret
      # GDRIVE_SA_JSON (cle d'un compte de service Google) est configure.
      # Le dossier Drive est synchronise sur la derniere sauvegarde (toujours a jour).
      - name: Deposer dans Google Drive
        if: ${{ env.HAS_GDRIVE == 'true' }}
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '1zA-k8LdhxbdSx7R4wGsKtqlQUMkWKyOI' }}
        run: |
          set -e
          curl -fsSL https://rclone.org/install.sh | sudo bash
          printf '%s' "$GDRIVE_SA_JSON" > /tmp/sa.json
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          service_account_file = /tmp/sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF
          # sync = le dossier Drive reflete la derniere sauvegarde (l'historique reste dans les Releases)
          rclone sync backup/ gdrive: --drive-use-trash=false -v
          rm -f /tmp/sa.json
