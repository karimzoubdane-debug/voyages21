name: Fix voyages21-monde Vercel settings

on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: 'Vercel API token'
        required: true
        type: string

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ github.event.inputs.vercel_token }}"

      - name: Update voyages21-monde project settings
        run: |
          echo "Patching project prj_LEzTq40IoLjZL0Leo4c5it7tu2rJ..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            https://api.vercel.com/v9/projects/prj_LEzTq40IoLjZL0Leo4c5it7tu2rJ \
            -H "Authorization: Bearer ${{ github.event.inputs.vercel_token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "framework": null,
              "buildCommand": "",
              "outputDirectory": "public/design",
              "installCommand": "",
              "devCommand": ""
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('name:', d.get('name','?')); print('framework:', d.get('framework','null')); print('buildCommand:', d.get('buildCommand','(empty)')); print('outputDirectory:', d.get('outputDirectory','?'))" 2>/dev/null || echo "$BODY"
          [ "$HTTP_CODE" = "200" ] || exit 1

      - name: Trigger new deployment
        run: |
          echo "Triggering redeploy..."
          curl -s -X POST \
            https://api.vercel.com/v13/deployments \
            -H "Authorization: Bearer ${{ github.event.inputs.vercel_token }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"voyages21-monde","gitSource":{"type":"github","repoId":"karimzoubdane-debug/voyages21","ref":"claude/confident-meitner-Fiqzd"}}' | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy URL:', d.get('url','?')); print('State:', d.get('readyState','?'))" 2>/dev/null || echo "Redeploy triggered"
