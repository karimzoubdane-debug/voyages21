name: Fix voyages21-monde Vercel settings

on:
  push:
    branches:
      - 'claude/confident-meitner-Fiqzd'
    paths:
      - '.github/workflows/fix-vercel-monde.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VTOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_ID: prj_LEzTq40IoLjZL0Leo4c5it7tu2rJ
    steps:
      - name: Patch Vercel project (static, no build)
        run: |
          cat > /tmp/payload.json << 'PAYLOAD'
          {"framework":null,"buildCommand":"","outputDirectory":"public/design","installCommand":"","devCommand":""}
          PAYLOAD
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PATCH "https://api.vercel.com/v9/projects/${PROJECT_ID}" \
            -H "Authorization: Bearer ${VTOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json)
          echo "HTTP: $HTTP"
          cat /tmp/resp.json | python3 -m json.tool | head -20 || cat /tmp/resp.json
          test "$HTTP" -eq 200

      - name: Trigger production redeploy via Vercel API
        run: |
          cat > /tmp/deploy.json << DPAYLOAD
          {"name":"voyages21-monde","target":"production","gitSource":{"type":"github","repo":"karimzoubdane-debug/voyages21","ref":"claude/confident-meitner-Fiqzd"}}
          DPAYLOAD
          curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${VTOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/deploy.json | python3 -m json.tool | head -10 || echo done
