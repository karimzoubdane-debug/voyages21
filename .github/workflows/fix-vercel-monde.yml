name: Fix voyages21-monde Vercel settings

on:
  push:
    branches:
      - 'claude/confident-meitner-Fiqzd'
    paths:
      - '.github/workflows/fix-vercel-monde.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Test basic execution
        run: |
          echo "Runner is alive"
          date
          echo "Secret set: ${{ secrets.VERCEL_TOKEN != '' }}"

      - name: Call Vercel API
        env:
          VTOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Calling Vercel API..."
          RESULT=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -X PATCH "https://api.vercel.com/v9/projects/prj_LEzTq40IoLjZL0Leo4c5it7tu2rJ" \
            -H "Authorization: Bearer ${VTOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"framework":null,"buildCommand":"","outputDirectory":"public/design","installCommand":""}')
          echo "$RESULT"
          HTTP_CODE=$(echo "$RESULT" | grep HTTP_CODE | cut -d: -f2)
          echo "Final HTTP code: $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ]
