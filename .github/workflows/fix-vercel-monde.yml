name: Fix voyages21-monde Vercel settings

on:
  push:
    branches:
      - 'claude/confident-meitner-Fiqzd'
    paths:
      - '.github/workflows/fix-vercel-monde.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch Vercel project and show full response
        env:
          VTOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Token length: ${#VTOKEN}"
          echo "Token prefix: ${VTOKEN:0:8}..."

          echo '{"framework":null,"buildCommand":"","outputDirectory":"public/design","installCommand":"","devCommand":""}' > /tmp/payload.json
          cat /tmp/payload.json

          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PATCH "https://api.vercel.com/v9/projects/prj_LEzTq40IoLjZL0Leo4c5it7tu2rJ" \
            -H "Authorization: Bearer ${VTOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json)

          echo "=== HTTP STATUS: $HTTP ==="
          echo "=== RESPONSE BODY ==="
          cat /tmp/resp.json || echo "(empty response)"

          if [ "$HTTP" = "200" ]; then
            echo "SUCCESS - project patched!"
          else
            echo "FAILED - HTTP $HTTP"
            exit 1
          fi
