name: Revue Cockpit (soir)

# Revue automatique de fin de journee des projets du Cockpit.
#  - Tourne chaque soir a 20:00 heure du Maroc (19:00 UTC).
#  - Lit cockpit-data.json et ouvre / met a jour une GitHub Issue "Revue Cockpit du jour"
#    qui liste, projet par projet : statut, prochaine etape, et les questions/decisions
#    en attente (celles qui necessitent une reponse de Karim).
#  - La mise a jour INTELLIGENTE des donnees (3 dernieres actions, changement de statut...)
#    reste faite par l'IA quand Karim relance avec le mot-cle "REVUE COCKPIT" (voir REVUE-COCKPIT.md).
#
# Declenchement manuel possible via l'onglet Actions (workflow_dispatch).

on:
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC = 20:00 Maroc
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  revue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire et publier la revue du soir
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('cockpit-data.json', 'utf8'));
            const projects = data.projects || [];
            const meta = data._meta || {};

            const STATUS = {
              publie: 'Publie', en_cours: 'En cours', en_suspens: 'En suspens',
              planifie: 'Planifie', termine: 'Termine', abandonne: 'Abandonne'
            };

            // Date du jour en heure du Maroc (UTC+1)
            const now = new Date(Date.now() + 60 * 60 * 1000);
            const jour = now.toISOString().slice(0, 10);

            // Regroupement par categorie
            const cats = (meta.categories || []).map(c => c.key);
            const catLabel = Object.fromEntries((meta.categories || []).map(c => [c.key, c.label]));

            const totalPending = projects.reduce((s, p) => s + ((p.pending || []).length), 0);
            const projPending = projects.filter(p => (p.pending || []).length).length;

            let body = '';
            body += `> Revue automatique du soir — ${jour} (20:00 Maroc). Cochez ce que vous traitez.\n\n`;
            body += `**${projects.length} projets** · ${projects.filter(p=>p.status==='en_cours').length} en cours · `;
            body += `${projects.filter(p=>p.status==='en_suspens').length} en suspens · `;
            body += `**${totalPending} question(s)/decision(s) en attente** sur ${projPending} projet(s).\n\n`;

            body += `## Questions / decisions qui attendent VOTRE reponse\n\n`;
            if (totalPending === 0) {
              body += `_Rien en attente. Belle journee !_\n\n`;
            } else {
              for (const p of projects) {
                const pend = p.pending || [];
                if (!pend.length) continue;
                body += `### ${p.title}  \n`;
                for (const q of pend) body += `- [ ] ${q}\n`;
                body += `\n`;
              }
            }

            body += `## Etat de tous les projets (par categorie)\n\n`;
            const shownCats = cats.length ? cats : [...new Set(projects.map(p => p.cat))];
            for (const ck of shownCats) {
              const items = projects.filter(p => p.cat === ck);
              if (!items.length) continue;
              body += `**${catLabel[ck] || ck}**\n`;
              for (const p of items) {
                const nb = (p.pending || []).length;
                const la = (p.lastActions || [])[0];
                body += `- \`${STATUS[p.status] || p.status}\` **${p.title}**`;
                if (nb) body += ` — ⏳ ${nb} en attente`;
                if (p.nextStep) body += `  \n  → Prochaine : ${p.nextStep}`;
                if (la) body += `  \n  _Derniere action (${la.date}) : ${la.text}_`;
                body += `\n`;
              }
              body += `\n`;
            }

            body += `---\n`;
            body += `Pour mettre a jour le Cockpit (nouvelles actions, statut, questions resolues), `;
            body += `ouvrez une session et tapez **\`REVUE COCKPIT\`** — voir \`REVUE-COCKPIT.md\`.\n`;
            body += `Appli (installable) : https://voyages21.vercel.app/cockpit.html\n`;

            const title = `🌙 Revue Cockpit — ${jour}`;

            // Chercher une issue "revue cockpit" ouverte du jour pour la mettre a jour, sinon en creer une.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cockpit-revue', per_page: 20
            });
            const existing = openIssues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
              core.info(`Issue #${existing.number} mise a jour.`);
            } else {
              // Fermer les anciennes revues encore ouvertes pour garder une seule active.
              for (const i of openIssues) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: i.number, state: 'closed'
                });
              }
              // S'assurer que le label existe.
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'cockpit-revue' });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: 'cockpit-revue', color: 'a78bfa',
                  description: 'Rappel de revue du soir du Cockpit'
                });
              }
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['cockpit-revue']
              });
              core.info(`Issue #${created.number} creee.`);
            }
